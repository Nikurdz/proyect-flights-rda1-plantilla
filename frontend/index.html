<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RAM Alliance: busca y compra vuelos directos entre Ecuador, Colombia, Perú, Chile, Argentina, Brasil, Panamá, Estados Unidos y España." />
    <meta name="theme-color" content="#0B0E14" />
    <title>RAM Alliance | Vuelos</title>
    <script>
      // Applies the saved theme before the first paint (no flash). Keep in sync with src/lib/theme.ts.
      (function () {
        var mode = 'system';
        try {
          var saved = localStorage.getItem('ram-theme');
          if (saved === 'light' || saved === 'dark' || saved === 'system') mode = saved;
        } catch (e) {}
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        if (dark) root.classList.add('dark');
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body class="bg-paper text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
