    CuentaBloqueada:
      name: CuentaBloqueada
      title: CuentaBloqueada
      summary: Cuenta bloqueada temporalmente por intentos fallidos.
      contentType: application/json
      headers:
        type: object
        properties:
          correlation_id:
            type: string
      payload:
        allOf:
