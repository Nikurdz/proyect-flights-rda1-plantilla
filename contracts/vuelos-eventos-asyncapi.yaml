asyncapi: 2.6.0
info:
  title: RAM Alliance Vuelos - eventos de dominio
  version: 1.0.0
  description: |
    Contrato de los eventos que publica el módulo Vuelos en el exchange `booking.events` (RabbitMQ, opcional con
    `RABBITMQ_URL`; sin broker se entregan en proceso con el mismo formato). Cada payload tiene su JSON Schema en
    `contracts/eventos` (fuente de verdad, validado con ajv en runtime y en CI). Política: SemVer por esquema,
    compatibilidad BACKWARD_TRANSITIVE; un cambio incompatible va en un archivo `.v2`.
    Garantía: entrega at-least-once, consumidores idempotentes por `id`, 3 reintentos y luego `q.dead_letter`.
defaultContentType: application/json
servers:
  broker:
    url: amqp://{host}:5672
    protocol: amqp
    variables:
      host:
        default: localhost
channels:
  q.general:
    description: Cola q.general (routing key = nombre de la cola en el exchange direct booking.events).
    bindings:
      amqp:
        is: queue
        queue:
          name: q.general
          durable: true
          deadLetterExchange: booking.dlx
    subscribe:
      operationId: consumir_q_general
      message:
        oneOf:
          - $ref: '#/components/messages/ClienteRegistrado'
          - $ref: '#/components/messages/ConfiguracionMercadoPublicada'
          - $ref: '#/components/messages/ConsentimientoActualizado'
          - $ref: '#/components/messages/CuentaBloqueada'
          - $ref: '#/components/messages/OfertaCreada'
          - $ref: '#/components/messages/OfertaVencida'
          - $ref: '#/components/messages/PagoAutorizado'
          - $ref: '#/components/messages/booking_baggage_added'
          - $ref: '#/components/messages/booking_changed'
          - $ref: '#/components/messages/booking_checked_in'
          - $ref: '#/components/messages/booking_failed'
          - $ref: '#/components/messages/booking_seat_changed'
          - $ref: '#/components/messages/booking_ticket_failed'
          - $ref: '#/components/messages/booking_ticket_issuing'
          - $ref: '#/components/messages/flight_cancelled'
          - $ref: '#/components/messages/flight_schedule_changed'
          - $ref: '#/components/messages/flight_status_changed'
          - $ref: '#/components/messages/hold_created'
          - $ref: '#/components/messages/hold_expired'
          - $ref: '#/components/messages/hold_released'
          - $ref: '#/components/messages/proveedor_activado'
          - $ref: '#/components/messages/proveedor_apagado'
          - $ref: '#/components/messages/proveedor_registrado'
          - $ref: '#/components/messages/proveedor_salud'
          - $ref: '#/components/messages/proveedor_sincronizado'
  q.ordenes.confirmadas:
    description: Cola q.ordenes.confirmadas (routing key = nombre de la cola en el exchange direct booking.events).
    bindings:
      amqp:
        is: queue
        queue:
          name: q.ordenes.confirmadas
          durable: true
          deadLetterExchange: booking.dlx
    subscribe:
      operationId: consumir_q_ordenes_confirmadas
      message:
        oneOf:
          - $ref: '#/components/messages/OrdenEmitida'
          - $ref: '#/components/messages/ReservaExternaConfirmada'
          - $ref: '#/components/messages/booking_confirmed'
          - $ref: '#/components/messages/booking_ticket_issued'
  q.sagas.compensacion:
    description: Cola q.sagas.compensacion (routing key = nombre de la cola en el exchange direct booking.events).
    bindings:
      amqp:
        is: queue
        queue:
          name: q.sagas.compensacion
          durable: true
          deadLetterExchange: booking.dlx
    subscribe:
      operationId: consumir_q_sagas_compensacion
      message:
        oneOf:
          - $ref: '#/components/messages/OrdenFallidaCompensada'
          - $ref: '#/components/messages/PagoAnulado'
          - $ref: '#/components/messages/PagoRechazado'
          - $ref: '#/components/messages/PagoReembolsado'
          - $ref: '#/components/messages/ReservaExternaCancelada'
          - $ref: '#/components/messages/ReservaExternaFallida'
          - $ref: '#/components/messages/booking_cancelled'
  q.vuelos.entrantes:
    description: Eventos que publica Booking Prototipo para la aerolinea (CloudEvents; routing keys pagos.payment.confirmed, pagos.payment.failed, paquetes.package.cancelled).
    bindings:
      amqp:
        is: queue
        queue:
          name: q.vuelos.entrantes
          durable: true
          deadLetterExchange: booking.dlx
    publish:
      operationId: recibir_q_vuelos_entrantes
      message:
        oneOf:
          - $ref: '#/components/messages/pagos_payment_confirmed'
          - $ref: '#/components/messages/pagos_payment_failed'
          - $ref: '#/components/messages/paquetes_package_cancelled'
  q.dead_letter:
    description: Mensajes que agotaron 3 reintentos; requieren revisión manual (alerta sugerida si hay más de 10).
    subscribe:
      operationId: revisar_dead_letter
      message:
        $ref: '#/components/messages/Envelope'
components:
  messages:
    Envelope:
      name: Envelope
      title: Sobre del evento (cualquier tipo)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/Envelope'
    ClienteRegistrado:
      name: ClienteRegistrado
      title: ClienteRegistrado
      summary: Cuenta de cliente creada (lleva el token de verificación para el correo).
      contentType: application/json
      headers:
        type: object
        properties:
          correlation_id:
            type: string
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type:
                const: ClienteRegistrado
              payload:
                $ref: './eventos/ClienteRegistrado.v1.schema.json'
    ConfiguracionMercadoPublicada:
      name: ConfiguracionMercadoPublicada
      title: ConfiguracionMercadoPublicada
