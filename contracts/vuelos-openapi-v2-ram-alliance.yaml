        Libera los asientos del vuelo original y ocupa los del nuevo (dos `StockChangeEvent` por gRPC).
        Si hay diferencia a pagar, Booking cobra antes y envía `payment`. Emite `booking.changed`.

        **Nota de implementación (RAM Alliance):** Si hay algo que pagar, envíe `payment.paymentReference` (de un solo uso). Responde el detalle de la reserva ya cambiada.

        **Sin 202:** este nodo emite y confirma de forma síncrona, así que responde siempre el código de éxito inmediato (nunca 202).
      security:
