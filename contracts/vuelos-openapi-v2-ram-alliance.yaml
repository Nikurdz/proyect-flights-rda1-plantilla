# GENERADO por scripts/build-contract-v2.js — no editar a mano.
# Base: contracts/vuelos-openapi-v2.yaml (plantilla de Booking). Parche propio: contracts/overlay/vuelos-v2-ram-alliance.overlay.yaml.
# Regenerar: npm run contract:v2:build
openapi: 3.0.3
info:
  title: RAM Alliance Vuelos — API de vuelos (contrato v2)
  version: 2.0.0-ram-alliance
  license:
    name: Uso académico — Integración de Sistemas PUCE
  contact:
    name: Equipo RAM Alliance Vuelos (PUCE) — David Tapia
    email: alejandro.floreslu@outlook.com
  description: |
    # RAM Alliance Vuelos — contrato de integración v2

    > **Sistema proveedor:** RAM Alliance Vuelos (categoría *Vuelos*), detrás de una sola URL base.
    > **Sistema consumidor:** Booking Prototipo (marketplace multimodal).
    > **Base del contrato:** la plantilla común de Booking (`vuelos-openapi-v2.yaml`), **ajustada a lo que este nodo realmente responde**.
    > Este documento se genera con `npm run contract:v2:build` y las respuestas reales de la API se validan contra sus esquemas en las pruebas.

    ## 1. Cómo conectarse
    | Dato | Valor |
    |---|---|
    | URL base | `http://{host}:{port}/api/v2` — endpoints en `/vuelos/...` |
    | Pruebas locales (Tailscale) | `http://100.118.24.48:3000/api/v2/vuelos` |
    | Token OAuth2 | `POST /api/v2/oauth2/token` |
    | Salud (sin token) | `GET /api/v2/vuelos/health` |
    | Documentación navegable | `/api/docs-v2` |
    | `X-API-Key` | **No se usa.** La autenticación es OAuth2 `client_credentials` (Bearer) |

    ## 2. Autenticación
    1. Booking pide un token con su `client_id` y `client_secret` (cuerpo `application/x-www-form-urlencoded` o JSON, o cabecera HTTP Basic).
    2. Envía `Authorization: Bearer <access_token>` en cada llamada. El token dura `expires_in` segundos (3600 por defecto); al vencer se pide otro.
    3. **Scopes:** `flights:read`, `flights:hold`, `flights:book`, `flights:cancel`, `flights:webhooks`, `flights:ops`, `flights:admin` (este último equivale a todos). Un token sin el scope de la operación recibe **403**; sin token, **401**.
    4. Booking identifica al cliente final con `X-User-Id` (hasta 50 caracteres `A-Z a-z 0-9 . _ : @ -`): las reservas, holds y suscripciones quedan a nombre de ese usuario y **solo él las ve** (otro `X-User-Id` recibe 403). Sin `X-User-Id` el dueño es el propio socio. Un webhook registrado **sin** `X-User-Id` recibe los eventos de **todos** los usuarios del socio.
    5. Operaciones públicas (sin token): `search`, `seatmap`, `GET flights/{n}/status`, `health` y el propio `oauth2/token`.

    ## 3. Convenciones
    * **Ids generados por este nodo son UUID**: `offerId`, `itineraryId`, `segmentId` (= id del vuelo), `holdId`, `bookingId`, `ticketId`, `quoteId`, `changeOfferId`, `refundId`. Use siempre los valores que devuelve la API (los ejemplos con prefijo `OFF-`/`SEG-`… de la plantilla no existen aquí).
    * **Ids que elige Booking:** `passengerId`, `paymentReference` (8–100 caracteres `A-Za-z0-9._:-`, de un solo uso), `partnerOrderId`, `packageId`.
    * **Idempotency-Key** (UUID v4) obligatoria en las escrituras que lo indican: se retiene 24 h. Mismo cuerpo → misma respuesta, con `Idempotent-Replayed: true` y código **200**; otro cuerpo con la misma clave → **409 `IDEMPOTENCY_KEY_REUSED`**.
    * **Trazabilidad:** `X-Correlation-Id` (8–100 caracteres `A-Za-z0-9._-`) se acepta y se devuelve sin cambios; si no viene o es inválido se genera uno. `X-Request-Id` identifica cada llamada. Todo error trae `correlation_id`, `instance` y `timestamp` (RFC 7807).
    * **Búsqueda:** `X-Device-Fingerprint` obligatorio y no vacío.
    * **Límite de tasa:** 300 peticiones por 60 s **por dirección IP** del cliente; al excederlo, **429** con `Retry-After`. `health` está exento.
    * **Paginación:** `limit` y `cursor` opacos (`nextCursor`); `GET /bookings` por defecto 10 (máx. 50), `operaciones/vuelos` por defecto 20 (máx. 100), `eventos` por defecto 20 (máx. 100).
    * **Dinero:** cadenas con dos decimales y moneda ISO-4217 (`USD`). Solo se vende en **clase ECONÓMICA**, vuelos directos.
    * **Pagos:** cobra Booking; este nodo solo recibe `payment.paymentReference` (y opcionalmente `amount`: si no coincide con el precio retenido, **422 `AMOUNT_MISMATCH`**). En cancelaciones el nodo **calcula** el reembolso y Booking lo ejecuta.

    ## 4. Eventos que publica este nodo (webhooks CloudEvents)
    Se registran con `POST /vuelos/webhooks` (la `url` debe ser **https** a una IP pública; en las pruebas locales por Tailscale el nodo se arranca con `WEBHOOKS_ALLOW_PRIVATE_HOSTS=true`). Cada entrega es un `POST` con el CloudEvent v1.0 estructurado:

    | Cabecera | Valor |
    |---|---|
    | `Content-Type` | `application/cloudevents+json` |
    | `X-Webhook-Id` | id de la entrega |
    | `X-Webhook-Event` | tipo corto (`booking.confirmed`…) |
    | `X-Webhook-Timestamp` | epoch en segundos (**no** forma parte de la firma) |
    | `X-Webhook-Signature` | `sha256=` + HMAC-SHA256(secret, **cuerpo crudo**) en hexadecimal |
    | `X-Correlation-Id` | `correlationid` del evento |

    Responda **2xx**; cualquier otra respuesta se reintenta a 1 min, 5 min, 30 min, 2 h y 6 h y luego la entrega queda `DEAD` (el evento sigue en `GET /vuelos/eventos`). Los 15 tipos y su `data` están en los esquemas `Event*`. `type` = `ec.edu.epn.booking.vuelos.<evento>`, `source` = `/aerolineas/ram-alliance/vuelos`.

    ## 5. Eventos que consume este nodo (publica Booking) — ver `x-asyncapi-inbound`
    ## 6. Stock por gRPC (este nodo es el cliente) — ver `x-grpc-stock`

    ## 7. Diferencias respecto a la plantilla de Booking
    | Tema | Plantilla | Este nodo |
    |---|---|---|
    | Ids | ejemplos `OFF-…`, `SEG-…`, `TKT-…`… | UUID (ver §3) |
    | 202 (`TICKET_ISSUING`, `CHANGE_PENDING`, `CANCELLATION_PENDING`) | posible | **nunca**: la emisión, el equipaje, el cambio de fecha y la cancelación son síncronos |
    | `BookingDetail.itineraries` / `passengers` | opcionales | **no se devuelven** (no se exponen datos personales) |
    | Check-in repetido | 409 | **200 idempotente** (no cambia nada). Cierra a la hora de salida si el nodo corre con `CHECKIN_CLOSES_HOURS=0` |
    | Cancelación sin `quoteId` | solo SAGA/FLIGHT | también `CUSTOMER_REQUEST`: se cotiza y aplica en el acto |
    | Límite de tasa de `search` | por `X-Device-Fingerprint` | por IP |
    | `health.circuit_breaker_estado` | real | siempre `CLOSED` |
    | `aircraft` en operaciones | modelo | `null` |
    | Mapa de asientos | `HELD` por asiento | un hold no fija asientos concretos: `AVAILABLE`, `BOOKED`/`TICKETED`, `CHECKED_IN`, `BOARDED` |
    | Asientos | con costo opcional | gratis; `payment` se acepta pero no se usa |

    ## 8. Máquinas de estado
    **Asiento:** `AVAILABLE → BOOKED/TICKETED → CHECKED_IN → BOARDED`. **Hold:** `HELD → CONSUMED | RELEASED | EXPIRED` (TTL 5–30 min, 15 por defecto; vencido = **410 `HOLD_EXPIRED`**). **Reserva:** `CONFIRMED`, `CANCELLED`, `FAILED` (y los estados transitorios del contrato). **Vuelo:** `SCHEDULED → BOARDING → DEPARTED → ARRIVED`, con `DELAYED`, `CANCELLED`, `DIVERTED`. **Check-in:** abre 48 h antes de la salida.
servers:
  - url: http://{host}:{port}/api/v2
    description: Este nodo. Por defecto, la laptop del equipo en la red Tailscale (pruebas de integración).
    variables:
      host:
        default: 100.118.24.48
        description: IP de Tailscale (o nombre de host) donde corre el nodo
      port:
        default: '3000'
        description: Puerto del nodo
  - url: /api/v2
    description: Ruta relativa canónica (detrás del gateway del nodo)
security:
  - PartnerOAuth2: []
tags:
  - name: MS.Vuelos — Búsqueda y Catálogo
    description: Búsqueda multidestino, mapa de asientos y estado público de vuelos.
  - name: MS.Vuelos — Operaciones
    description: Panel de ocupación por vuelo y cabina y cambio de estado operativo (scope flights:ops).
  - name: MS.Vuelos — Promociones B2B
    description: Acuerdo comercial de promociones y combos con Booking Prototipo.
  - name: MS.Vuelos — Telemetría
    description: Salud del nodo y feed outbox de eventos.
  - name: MS.Reservas — Bloqueo de Cupos (Hold)
    description: Retención temporal de asientos con precio congelado y TTL.
  - name: MS.Reservas — Reservas y Emisión
    description: Creación de reservas con paymentReference, consulta y emisión de boletos.
  - name: MS.Reservas — Asientos, Check-in y Boarding Pass
    description: Cambio de asiento, check-in en línea y pases de abordar.
  - name: MS.Postventa
    description: Equipaje extra, cambio de fecha, cotización y cancelación.
  - name: MS.Clientes — Webhooks
    description: Suscripciones para recibir eventos CloudEvents firmados.
  - name: MS.Clientes — OAuth2
    description: Token de servicio (client_credentials) para Booking Prototipo.
x-tagGroups:
  - name: MS.Vuelos
    tags:
      - MS.Vuelos — Búsqueda y Catálogo
      - MS.Vuelos — Operaciones
      - MS.Vuelos — Promociones B2B
      - MS.Vuelos — Telemetría
  - name: MS.Reservas
    tags:
      - MS.Reservas — Bloqueo de Cupos (Hold)
      - MS.Reservas — Reservas y Emisión
      - MS.Reservas — Asientos, Check-in y Boarding Pass
  - name: MS.Postventa
    tags:
      - MS.Postventa
  - name: MS.Clientes
    tags:
      - MS.Clientes — Webhooks
      - MS.Clientes — OAuth2
paths:
  /vuelos/health:
    get:
      tags:
        - MS.Vuelos — Telemetría
      operationId: getHealth
      x-microservice: MS.Vuelos
      summary: Salud y telemetría del nodo de vuelos (semáforo 🟢/🔴 del Panel 1)
      description: |
        Consumido por el Monitor de Nodos de Booking. Responde **200** si el nodo está `HEALTHY` o `DEGRADED` y **503**
        si está `DOWN`. Debe responder en menos de 1 s y no requiere token. Usa los mismos campos que el resto de verticales.

        **Nota de implementación (RAM Alliance):** `circuit_breaker_estado` es siempre `CLOSED`. `status` es `DOWN` (503) si la base de datos no responde y `DEGRADED` si tarda más de 1 s.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Nodo operativo (HEALTHY o DEGRADED)
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VuelosHealthResponse'
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          description: Nodo caído (DOWN) — mismo cuerpo de salud con `status = DOWN`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VuelosHealthResponse'
  /vuelos/eventos:
    get:
      tags:
        - MS.Vuelos — Telemetría
      operationId: listOutboxEvents
      x-microservice: MS.Vuelos
      summary: Feed outbox de eventos CloudEvents (respaldo de los webhooks)
      description: |
        Expone en orden cronológico los eventos registrados por el patrón Transactional Outbox. Booking lo usa para
        reconciliar eventos que no llegaron por webhook. Paginación por cursor con `after` (id del último evento leído).

        **Nota de implementación (RAM Alliance):** El `id` de cada evento es el UUID del evento (el mismo del webhook). El cursor es `metadata.next_after` (`evt-vue-000120`); un `after` desconocido responde 400 en lugar de reiniciar. `metadata.total` es el tamaño de la página.
      security:
        - PartnerOAuth2:
            - flights:read
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          required: false
          description: Id del último evento ya procesado; devuelve los posteriores.
          schema:
            type: string
          example: evt-vue-000120
        - name: type
          in: query
          required: false
          description: Filtra por tipo corto de evento (ej. `booking.confirmed`).
          schema:
            $ref: '#/components/schemas/VuelosEventName'
      responses:
        '200':
          description: Página de eventos
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VuelosEventosResponse'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '429':
          $ref: '#/components/responses/Problem429'
  /vuelos/promociones/contrato:
    get:
      tags:
        - MS.Vuelos — Promociones B2B
      operationId: getPromotionAgreement
      x-microservice: MS.Vuelos
      summary: Consultar el acuerdo B2B de promociones y combos
      description: Devuelve si la aerolínea acepta participar en combos y el porcentaje máximo de descuento autorizado.
      security:
        - PartnerOAuth2:
            - flights:read
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Acuerdo vigente
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratoPromocionesResponse'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '429':
          $ref: '#/components/responses/Problem429'
    put:
      tags:
        - MS.Vuelos — Promociones B2B
      operationId: putPromotionAgreement
      x-microservice: MS.Vuelos
      summary: Formalizar o actualizar el acuerdo B2B de promociones
      description: |
        Responde una sola vez el cuestionario de la cátedra:
        1. ¿Acepta participar en promociones y combos? (`permite_promociones`)
        2. ¿Cuál es el porcentaje máximo de descuento? (`porcentaje_descuento_maximo`)
        3. ¿En qué rutas, destinos y cabinas aplica?

        **Nota de implementación (RAM Alliance):** Responde el contrato plano (`permite_promociones`, `porcentaje_descuento_maximo`, listas…). Las `rutas_habilitadas` son `AAA-BBB` y los `destinos_habilitados` códigos IATA de 3 letras. Una venta con `salesChannel.promotionApplied` se rechaza con 422 `PROMOTION_DISCOUNT_OUT_OF_RANGE` si supera el máximo o no hay acuerdo vigente.
      security:
        - PartnerOAuth2:
            - flights:admin
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContratoPromocionesRequest'
      responses:
        '200':
          description: Acuerdo registrado
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: Acuerdo B2B de promociones de vuelos actualizado exitosamente.
                  contrato:
                    $ref: '#/components/schemas/ContratoPromocionesResponse'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
  /vuelos/search:
    post:
      tags:
        - MS.Vuelos — Búsqueda y Catálogo
      operationId: searchFlights
      x-microservice: MS.Vuelos
      summary: Búsqueda de vuelos (solo ida, ida y vuelta o multidestino)
      description: |
        Devuelve ofertas con precios por tipo de pasajero, cabina, reglas tarifarias y equipaje incluido.
        Solo muestra cabinas con `availableSeats > 0`. Límite de peticiones por dispositivo (`X-Device-Fingerprint`) → 429.

        **Nota de implementación (RAM Alliance):** Vuelos directos, clase económica; como máximo `OFFER_MAX_COMBINATIONS` ofertas (5 por defecto), las más baratas primero. El límite de tasa es por IP, no por dispositivo.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/DeviceFingerprint'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Ofertas encontradas
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/Problem400'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          $ref: '#/components/responses/Problem503'
  /vuelos/offers/{offerId}/seatmap:
    get:
      tags:
        - MS.Vuelos — Búsqueda y Catálogo
      operationId: getSeatMap
      x-microservice: MS.Vuelos
      summary: Mapa de asientos de un segmento con el estado de cada asiento
      security: []
      parameters:
        - $ref: '#/components/parameters/OfferId'
        - name: segmentId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          example: 2d3443d3-06a9-4418-887b-b4f738ed0ac7
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Mapa de asientos (sin precios)
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatMapResponse'
        '404':
          $ref: '#/components/responses/Problem404'
        '410':
          $ref: '#/components/responses/Problem410'
        '429':
          $ref: '#/components/responses/Problem429'
      description: |


        **Nota de implementación (RAM Alliance):** `segmentId` es el id del vuelo (UUID). Un hold no fija asientos: el estado por asiento es `AVAILABLE`, `BOOKED`/`TICKETED`, `CHECKED_IN` o `BOARDED`. Oferta vencida: 410 `OFFER_NO_LONGER_AVAILABLE`.
  /vuelos/flights/{flightNumber}/status:
    get:
      tags:
        - MS.Vuelos — Búsqueda y Catálogo
      operationId: getFlightStatus
      x-microservice: MS.Vuelos
      summary: Estado operativo de un vuelo en una fecha
      security: []
      parameters:
        - $ref: '#/components/parameters/FlightNumber'
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-11-20'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Estado del vuelo
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightStatus'
        '404':
          $ref: '#/components/responses/Problem404'
        '429':
          $ref: '#/components/responses/Problem429'
      description: |


        **Nota de implementación (RAM Alliance):** El parámetro `date` es obligatorio.
    patch:
      tags:
        - MS.Vuelos — Operaciones
      operationId: updateFlightStatus
      x-microservice: MS.Vuelos
      summary: Cambiar el estado operativo de un vuelo (rol OPS / ADMIN)
      description: |
        Registra demoras, cambios de puerta, cancelaciones o desvíos. Valida la transición de estados
        (ej. no se puede pasar de `ARRIVED` a `BOARDING` → 409 `INVALID_STATUS_TRANSITION`).
        Emite el evento `flight.status_changed`, que consumen Booking, Autos y Alojamientos.
        Si el nuevo estado es `CANCELLED`, las reservas afectadas pasan a gestión de reembolso.

        **Nota de implementación (RAM Alliance):** Las transiciones válidas son SCHEDULED→{DELAYED,BOARDING,DEPARTED,CANCELLED,DIVERTED}, DELAYED→{SCHEDULED,BOARDING,DEPARTED,CANCELLED,DIVERTED}, BOARDING→{DELAYED,DEPARTED,CANCELLED}, DEPARTED→{ARRIVED,DIVERTED}, DIVERTED→{ARRIVED}; ARRIVED y CANCELLED son finales (409 `INVALID_STATUS_TRANSITION`). DELAYED exige `estimatedDepartureAt`. CANCELLED cancela las reservas con reembolso total.
      security:
        - PartnerOAuth2:
            - flights:ops
      parameters:
        - $ref: '#/components/parameters/FlightNumber'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRoles'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlightStatusUpdateRequest'
      responses:
        '200':
          description: Estado actualizado y evento emitido
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightStatusUpdateResponse'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '429':
          $ref: '#/components/responses/Problem429'
  /vuelos/operaciones/vuelos:
    get:
      tags:
        - MS.Vuelos — Operaciones
      operationId: listFlightOperations
      x-microservice: MS.Vuelos
      summary: Panel de ocupación por vuelo y cabina (equivalente al panel de flota de autos)
      description: |
        Devuelve, para cada vuelo de la fecha, los asientos por estado (`AVAILABLE`, `HELD`, `BOOKED`, `TICKETED`,
        `CHECKED_IN`, `BOARDED`), el factor de ocupación, los holds activos con su próximo vencimiento y alertas
        operativas (sobreventa, demora, check-in abierto).

        **Nota de implementación (RAM Alliance):** `loadFactor` es un porcentaje (0–100, un decimal). Solo hay cabina ECONOMY; `aircraft` es null. El filtro `status` se aplica antes de paginar. En `seatsByStatus`, `BOOKED` es siempre 0 (la emisión es inmediata).
      security:
        - PartnerOAuth2:
            - flights:ops
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRoles'
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-11-20'
        - name: origin
          in: query
          required: false
          schema:
            type: string
            pattern: ^[A-Z]{3}$
          example: UIO
