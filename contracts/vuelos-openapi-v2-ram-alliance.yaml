      x-microservice: MS.Postventa
      summary: Cotizar penalidad y reembolso antes de cancelar
      description: |
        No cambia el estado de la reserva. El `quoteId` devuelto es obligatorio en `cancel` y vence en `expiresAt`.

        **Nota de implementación (RAM Alliance):** La cotización vive 15 minutos. Tarifa reembolsable: total menos 10 % de penalidad; no reembolsable: solo impuestos; el equipaje extra se devuelve completo. No se cancela a menos de 3 h de la salida.
      security:
        - PartnerOAuth2:
            - flights:read
