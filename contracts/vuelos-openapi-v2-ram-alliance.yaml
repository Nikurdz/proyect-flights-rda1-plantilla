      operationId: createBooking
      x-microservice: MS.Reservas
      summary: Crear reserva a partir de un hold (con paymentReference de Booking)
      description: |
        Convierte el hold en reserva (`HELD → CONSUMED`), registra pasajeros y genera el PNR.
        **Pagos:** el cobro lo hizo Booking; aquí solo llega `payment.paymentReference`. La aerolínea **no cobra** y solo valida
        la referencia (`PAYMENT_REFERENCE_INVALID`, `AMOUNT_MISMATCH`).
        Emisión: si es inmediata responde **201** (`CONFIRMED`); si continúa en segundo plano responde **202**
        (`TICKET_ISSUING`) y el resultado llega por el evento `booking.ticket_issued` / `booking.ticket_failed`.
        Emite `booking.confirmed`. **Compensación Saga:** `POST /vuelos/bookings/{bookingId}/cancel`.

        **Nota de implementación (RAM Alliance):** Siempre **201** con la reserva ya `CONFIRMED` y los boletos emitidos (nunca 202). `payment.amount`, si viene, debe coincidir con el precio retenido (422 `AMOUNT_MISMATCH`); una `paymentReference` ya usada responde 422 `PAYMENT_REFERENCE_INVALID`. En viajes internacionales todos los pasajeros necesitan pasaporte (422 `PASSPORT_REQUIRED_INTERNATIONAL`). Pasajeros: hasta `MAX_PASSENGERS_PER_ORDER` (9). Responde `Location`.

        **Sin 202:** este nodo emite y confirma de forma síncrona, así que responde siempre el código de éxito inmediato (nunca 202).
