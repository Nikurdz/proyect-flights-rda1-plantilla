  /vuelos/bookings/{bookingId}/cancel:
    post:
      tags:
        - MS.Postventa
      operationId: cancelBooking
      x-microservice: MS.Postventa
      summary: Cancelar una reserva (compensación Saga)
      description: |
        Anula los boletos, devuelve los asientos a `AVAILABLE` (StockChangeEvent con delta positivo) y calcula el reembolso
        según la cotización (`quoteId`). **Booking ejecuta el reembolso** al cliente con su pasarela; la aerolínea solo informa
        el monto (`refund.status = CALCULATED`). Emite `booking.cancelled`.
        Usado por Booking como paso de compensación LIFO cuando falla otra parte de un combo; en ese caso envía
        `reasonCode = SAGA_COMPENSATION` y la penalidad no aplica si así lo permite el acuerdo B2B.

        **Nota de implementación (RAM Alliance):** `quoteId` es opcional en todos los motivos: sin él se cotiza y aplica en el acto. `FLIGHT_CANCELLED` reembolsa el total. `refund.percentage` es un entero.

        **Sin 202:** este nodo emite y confirma de forma síncrona, así que responde siempre el código de éxito inmediato (nunca 202).
      security:
        - PartnerOAuth2:
            - flights:cancel
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBookingRequest'
      responses:
        '200':
          description: Reserva cancelada, inventario restaurado y reembolso calculado
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelBookingResponse'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '410':
          $ref: '#/components/responses/Problem410'
        '429':
          $ref: '#/components/responses/Problem429'
  /vuelos/webhooks:
    get:
      tags:
        - MS.Clientes — Webhooks
      operationId: listWebhooks
      x-microservice: MS.Clientes
      summary: Listar suscripciones de webhooks del partner
      security:
        - PartnerOAuth2:
            - flights:webhooks
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Suscripciones activas
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookSubscription'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '429':
          $ref: '#/components/responses/Problem429'
    post:
      tags:
        - MS.Clientes — Webhooks
      operationId: createWebhook
      x-microservice: MS.Clientes
      summary: Registrar un webhook para recibir eventos CloudEvents
      description: |
        La aerolínea hará `POST` a `url` con cada evento suscrito, en formato CloudEvents estructurado
        (`application/cloudevents+json`), firmado con `X-Webhook-Signature: sha256=<HMAC-SHA256(secret, body)>`.
        Reintentos con backoff exponencial (1 min, 5 min, 30 min, 2 h, 6 h) hasta recibir 2xx. Los eventos no entregados
        siguen disponibles en `GET /vuelos/eventos`.

        **Nota de implementación (RAM Alliance):** Máximo 10 suscripciones por usuario. La respuesta no incluye el `secret`. Cada entrega se describe en la sección *callbacks* de esta operación y en §4.
      security:
        - PartnerOAuth2:
            - flights:webhooks
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscription'
      callbacks:
        vuelosEvent:
          '{$request.body#/url}':
            post:
              summary: Entrega de un evento de vuelos al suscriptor
              parameters:
                - name: X-Webhook-Signature
                  in: header
                  required: true
                  schema:
                    type: string
                  example: sha256=5d41402abc4b2a76b9719d911017c592
                - name: X-Correlation-Id
                  in: header
                  required: true
                  schema:
                    type: string
              requestBody:
                required: true
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: '#/components/schemas/VuelosCloudEvent'
              responses:
                '200':
                  description: Recibido
                '204':
                  description: Recibido
        eventDelivery:
          '{$request.body#/url}':
            post:
              summary: Entrega de un evento (CloudEvent estructurado) a la URL registrada
              description: Se envía por cada evento suscrito. Responda 2xx; si no, se reintenta (1 min, 5 min, 30 min, 2 h, 6 h) y después queda `DEAD`.
              parameters:
                - name: X-Webhook-Id
                  in: header
                  required: true
                  description: Id de la entrega.
                  schema:
                    type: string
                    format: uuid
                - name: X-Webhook-Event
                  in: header
                  required: true
                  schema:
                    $ref: '#/components/schemas/VuelosEventName'
                - name: X-Webhook-Timestamp
                  in: header
                  required: true
                  description: Epoch en segundos. No forma parte de la firma.
                  schema:
                    type: integer
                - name: X-Webhook-Signature
                  in: header
                  required: true
                  description: '`sha256=` + HMAC-SHA256(secret, cuerpo crudo) en hexadecimal.'
                  schema:
                    type: string
                    pattern: ^sha256=[0-9a-f]{64}$
                - name: X-Correlation-Id
                  in: header
                  required: true
                  schema:
                    type: string
              requestBody:
                required: true
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: '#/components/schemas/VuelosCloudEvent'
              responses:
                2XX:
                  description: Entrega aceptada
                default:
                  description: Cualquier otra respuesta (o un tiempo de espera de 5 s) se reintenta
      responses:
        '201':
          description: Webhook registrado
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '429':
          $ref: '#/components/responses/Problem429'
  /vuelos/webhooks/{id}:
    delete:
      tags:
        - MS.Clientes — Webhooks
      operationId: deleteWebhook
      x-microservice: MS.Clientes
      summary: Eliminar una suscripción
      security:
        - PartnerOAuth2:
            - flights:webhooks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Eliminada
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '429':
          $ref: '#/components/responses/Problem429'
  /oauth2/token:
    post:
      tags:
        - MS.Clientes — OAuth2
      operationId: issueToken
      x-microservice: MS.Clientes
      summary: Token de servicio (OAuth2 client_credentials)
      description: |
        Booking prueba quién es con su `client_id` y `client_secret` y recibe un token Bearer limitado a los scopes que pida (o a todos los que tiene permitidos).
        Acepta `application/x-www-form-urlencoded` (el estándar), JSON o la cabecera HTTP Basic (`client_id:client_secret` en base64). Solo existe el flujo `client_credentials`.
        Los errores usan el cuerpo de RFC 6749 (`error`, `error_description`), no `problem+json`. La respuesta lleva `Cache-Control: no-store`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
      responses:
        '200':
          description: Token emitido
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: '`unsupported_grant_type` o `invalid_scope` (se pidió un scope que el cliente no tiene)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: '`invalid_client` — cliente desconocido, inactivo o secreto incorrecto'
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Basic realm="vuelos"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          $ref: '#/components/responses/Problem429'
  /vuelos/webhooks/booking:
    post:
      tags:
        - MS.Clientes — Webhooks
      operationId: receiveBookingEvent
      x-microservice: MS.Clientes
      summary: Recibir un evento de Booking (CloudEvent firmado)
      description: |
        Endpoint donde **Booking publica sus eventos hacia este nodo** (los mismos que la cola `q.vuelos.entrantes`, para despliegues sin RabbitMQ, como las pruebas locales por Tailscale):
        `pagos.payment.confirmed` (emite los boletos), `pagos.payment.failed` (reserva en espera → FAILED; confirmada → cancelada como compensación) y `paquetes.package.cancelled` (cancela la parte de vuelo del combo).
        El cuerpo es un CloudEvent v1.0 estructurado (`type` = `ec.edu.epn.booking.<evento>`). La petición se autentica con la firma
        `X-Webhook-Signature: sha256=` + HMAC-SHA256(`BOOKING_WEBHOOK_SECRET`, **cuerpo crudo**) en hexadecimal (si se envía `X-Webhook-Timestamp` también se acepta la forma `timestamp.cuerpo`).
        Es idempotente por `id` del evento: Booking puede reintentar. Si el evento no se pudo procesar responde **500** para que se reintente.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInboundEvent'
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/BookingInboundEvent'
      responses:
        '200':
          description: Evento aceptado y procesado
          content:
            application/json:
              schema:
                type: object
                required:
                  - received
                  - eventId
                properties:
                  received:
                    type: boolean
                  eventId:
                    type: string
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
components:
  securitySchemes:
    PartnerOAuth2:
      type: oauth2
      description: |
        Token de servicio que este nodo emite a Booking Prototipo en `POST /api/v2/oauth2/token` (`client_credentials`).
        Booking reenvía la identidad del usuario final en `X-User-Id` (y opcionalmente `X-User-Roles`).
      flows:
        clientCredentials:
          tokenUrl: /api/v2/oauth2/token
          scopes:
            flights:read: Leer ofertas, holds, reservas, boletos y eventos
            flights:hold: Bloquear y liberar inventario
            flights:book: Crear reservas, emitir, cambiar asientos, postventa y check-in
            flights:cancel: Cancelar reservas
            flights:webhooks: Gestionar suscripciones de webhooks
            flights:ops: Operaciones de aeropuerto (panel de ocupación y estado de vuelo)
            flights:admin: Administración del acuerdo B2B y todas las operaciones
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Alternativa para desarrollo: un JWT de la plataforma (sus roles se traducen en scopes; ADMIN = todos).'
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Identificador del proceso de negocio completo. Si no llega, el primer servicio lo genera. Se propaga sin cambios
        y se devuelve en la respuesta.
      schema:
        type: string
        maxLength: 100
      example: corr-vuelos-7f3a9c
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Identificador de esta llamada HTTP concreta (un salto).
      schema:
        type: string
      example: req-8d2e41
    UserId:
      name: X-User-Id
      in: header
      required: false
      description: Usuario final autenticado por el gateway de Booking. Solo se confía en él con un token de partner válido.
      schema:
        type: string
      example: usr-4f9a2c
    UserRoles:
      name: X-User-Roles
      in: header
      required: false
      description: Roles del usuario separados por coma.
      schema:
        type: string
      example: OPS,ADMIN
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID v4 que identifica la operación. Un reintento con la misma clave y el mismo body devuelve la respuesta original
        (`Idempotent-Replayed: true`); con un body distinto responde 409 `IDEMPOTENCY_KEY_REUSED`. Se conserva 24 h.
      schema:
        type: string
        format: uuid
      example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Opcional — la operación ya es idempotente por construcción.
      schema:
        type: string
        format: uuid
      example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
    DeviceFingerprint:
      name: X-Device-Fingerprint
      in: header
      required: true
      description: Huella del dispositivo para el límite de peticiones y la propiedad de reservas anónimas.
      schema:
        type: string
      example: fp-3a7c9e21
    DeviceFingerprintOptional:
      name: X-Device-Fingerprint
      in: header
      required: false
      description: Huella del dispositivo (respaldo de propiedad cuando no hay `X-User-Id`).
      schema:
        type: string
      example: fp-3a7c9e21
    OfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 35c9650e-f055-4b92-88ff-6b8d34739c47
    HoldId:
      name: holdId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 3f1c2a9e-8b7d-4c21-9f0a-6e5d4c3b2a10
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    FlightNumber:
      name: flightNumber
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Z0-9]{2}[0-9]{1,4}$
      example: AV1632
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco devuelto en `nextCursor`.
      schema:
        type: string
  headers:
    X-Correlation-Id:
      description: Mismo valor recibido (o el generado si no llegó).
      schema:
        type: string
      example: corr-vuelos-7f3a9c
    Location:
      description: URL del recurso creado.
      schema:
        type: string
      example: /api/v2/vuelos/bookings/7c9e6679-7425-40de-944b-e07fc1f90ae7
    Idempotent-Replayed:
      description: '`true` cuando la respuesta proviene de un reintento con la misma Idempotency-Key.'
      schema:
        type: boolean
      example: true
    Retry-After:
      description: Segundos a esperar antes de reintentar.
      schema:
        type: integer
      example: 30
  responses:
    Problem400:
      description: Petición inválida (formato, campos obligatorios, fechas)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.booking.local/errors/validation-failed
            title: Petición inválida
            status: 400
            detail: El campo itineraries[0].origin debe ser un código IATA de 3 letras.
            instance: /api/v2/vuelos/search
            code: VALIDATION_FAILED
            correlation_id: corr-vuelos-7f3a9c
            timestamp: '2026-10-23T10:00:00Z'
            invalidParams:
              - name: itineraries[0].origin
                reason: pattern ^[A-Z]{3}$
    Problem401:
      description: Token de partner ausente, vencido o inválido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Problem403:
      description: Scope o rol insuficiente (ej. falta `flights:ops`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Problem404:
      description: Recurso no encontrado (oferta, hold, reserva, boleto o vuelo)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Problem409:
      description: |
        Conflicto de estado: `SEAT_TAKEN`, `HOLD_ALREADY_CONSUMED`, `IDEMPOTENCY_KEY_REUSED`, `ALREADY_CANCELLED`,
        `BOOKING_NOT_CANCELLABLE`, `CHECK_IN_NOT_AVAILABLE`, `CUTOFF_PASSED`, `INVALID_STATUS_TRANSITION`, `FLIGHT_CANCELLED`, etc.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.booking.local/errors/seat-taken
            title: Asiento no disponible
            status: 409
            detail: El asiento 12A del segmento 2d3443d3-06a9-4418-887b-b4f738ed0ac7 ya fue tomado.
            instance: /api/v2/vuelos/bookings/7c9e6679-7425-40de-944b-e07fc1f90ae7/seats
            code: SEAT_TAKEN
            correlation_id: corr-vuelos-7f3a9c
            timestamp: '2026-10-23T10:05:00Z'
    Problem410:
      description: Recurso vencido (`HOLD_EXPIRED`, `QUOTE_EXPIRED`, `CHANGE_OFFER_EXPIRED`, `OFFER_NO_LONGER_AVAILABLE`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.booking.local/errors/hold-expired
            title: Hold vencido
            status: 410
            detail: El bloqueo de asientos venció a las 10:15 UTC. Realice una nueva búsqueda.
            instance: /api/v2/vuelos/bookings
            code: HOLD_EXPIRED
            correlation_id: corr-vuelos-7f3a9c
            timestamp: '2026-10-23T10:16:02Z'
    Problem422:
      description: |
        Regla de negocio incumplida: `INFANT_WITHOUT_ADULT`, `INFANT_SEAT_NOT_ALLOWED`, `DOCUMENT_EXPIRED`,
        `PASSPORT_REQUIRED_INTERNATIONAL`, `PASSENGER_COUNT_MISMATCH`, `PAYMENT_REFERENCE_INVALID`, `AMOUNT_MISMATCH`,
        `SEAT_CABIN_MISMATCH`, `BAGGAGE_LIMIT_EXCEEDED`, `PROMOTION_DISCOUNT_OUT_OF_RANGE`, etc.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.booking.local/errors/infant-without-adult
            title: Infante sin adulto asociado
            status: 422
            detail: El pasajero PAX-3 (INFANT) debe indicar associatedAdultId de un ADULT de la misma reserva.
            instance: /api/v2/vuelos/bookings
            code: INFANT_WITHOUT_ADULT
            correlation_id: corr-vuelos-7f3a9c
            timestamp: '2026-10-23T10:06:00Z'
    Problem429:
      description: Demasiadas peticiones (`RATE_LIMIT_EXCEEDED`)
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Problem500:
      description: Error interno (`INTERNAL_ERROR`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Problem503:
      description: Sistema interno de la aerolínea no disponible o circuit breaker abierto (`PROVIDER_UNAVAILABLE`)
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    FlightOperationalStatus:
      type: string
      enum:
        - SCHEDULED
        - BOARDING
        - DEPARTED
        - DELAYED
        - ARRIVED
        - CANCELLED
        - DIVERTED
      example: SCHEDULED
    CabinClass:
      type: string
      enum:
        - ECONOMY
        - PREMIUM_ECONOMY
        - BUSINESS
        - FIRST
      example: ECONOMY
    PassengerType:
      type: string
      enum:
        - ADULT
        - YOUTH
        - CHILD
        - INFANT
      example: ADULT
    DocumentType:
      type: string
      enum:
        - PASSPORT
        - NATIONAL_ID
      example: NATIONAL_ID
    Gender:
      type: string
      enum:
        - M
        - F
        - X
      example: F
    SeatCharacteristic:
      type: string
      enum:
        - WINDOW
        - AISLE
        - EXTRA_LEGROOM
        - EMERGENCY_EXIT
    SeatStatus:
      type: string
      description: |
        Máquina de estados del asiento:
        `AVAILABLE` (disponible) → `HELD` (bloqueado por un hold) → `BOOKED` (reservado) → `TICKETED` (boleto emitido)
        → `CHECKED_IN` → `BOARDED` (abordado). Hold vencido/liberado o cancelación → `AVAILABLE`.
      enum:
        - AVAILABLE
        - HELD
        - BOOKED
        - TICKETED
        - CHECKED_IN
        - BOARDED
      example: AVAILABLE
    HoldStatus:
      type: string
      enum:
        - HELD
        - RELEASED
        - EXPIRED
        - CONSUMED
      example: HELD
    BookingStatus:
      type: string
      enum:
        - PENDING
        - PENDING_PAYMENT
        - TICKET_ISSUING
        - CONFIRMED
        - FAILED
        - CHANGE_PENDING
        - CANCELLATION_PENDING
        - CANCELLED
      example: CONFIRMED
    TicketStatus:
      type: string
      enum:
        - PENDING
        - ISSUING
        - ISSUED
        - FAILED
        - VOIDED
        - REFUNDED
      example: ISSUED
    TicketSegmentStatus:
      type: string
      enum:
        - PENDING
        - ISSUED
        - FAILED
      example: ISSUED
    CheckInStatus:
      type: string
      enum:
        - NOT_ELIGIBLE
        - AVAILABLE
        - IN_PROGRESS
        - COMPLETED
        - FAILED
      example: COMPLETED
    PassengerCheckInStatus:
      type: string
      enum:
        - CHECKED_IN
        - NOT_CHECKED_IN
        - FAILED
      example: CHECKED_IN
    MoneyAmount:
      type: object
      description: Importes como string decimal para evitar errores de punto flotante.
      required:
        - currency
        - total
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          example: USD
        baseFare:
          type: string
          example: '98.00'
        taxes:
          type: string
          example: '21.50'
        total:
          type: string
          example: '119.50'
    Link:
      type: object
      required:
        - href
      properties:
        href:
          type: string
          example: /api/v2/vuelos/bookings/7c9e6679-7425-40de-944b-e07fc1f90ae7
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
          example: GET
    Links:
      type: object
      description: Enlaces HATEOAS a las acciones disponibles según el estado actual del recurso.
      additionalProperties:
        $ref: '#/components/schemas/Link'
      example:
        self:
          href: /api/v2/vuelos/bookings/7c9e6679-7425-40de-944b-e07fc1f90ae7
          method: GET
        tickets:
          href: /api/v2/vuelos/bookings/7c9e6679-7425-40de-944b-e07fc1f90ae7/tickets
          method: GET
        seats:
          href: /api/v2/vuelos/bookings/7c9e6679-7425-40de-944b-e07fc1f90ae7/seats
          method: PUT
        check-in:
          href: /api/v2/vuelos/bookings/7c9e6679-7425-40de-944b-e07fc1f90ae7/check-in
          method: POST
        cancellation-quote:
          href: /api/v2/vuelos/bookings/7c9e6679-7425-40de-944b-e07fc1f90ae7/cancellation-quote
          method: GET
    PaymentReference:
      type: object
      description: |
        Referencia a un pago **ya cobrado por Booking**. La aerolínea no procesa tarjetas, 3DS, autorización ni captura;
        solo valida la referencia y, si llega, que `amount` coincida con el precio congelado (`AMOUNT_MISMATCH`).
      additionalProperties: false
      required:
        - paymentReference
      properties:
        paymentReference:
          type: string
          description: Identificador del pago generado por la pasarela de Booking.
          example: PAY-BKP-20261023-000981
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        provider:
          type: string
          description: Quién realizó el cobro.
          enum:
            - BOOKING_PROTOTIPO
            - AIRLINE_DIRECT
          default: BOOKING_PROTOTIPO
    SalesChannel:
      type: object
      description: Canal de venta. Permite a la aerolínea saltar el cobro y relacionar la reserva con el carrito o combo de Booking.
      properties:
        partnerId:
          type: string
          example: BOOKING_PROTOTIPO
        partnerOrderId:
          type: string
          description: Id de la orden o carrito en Booking.
          example: ORD-BKP-55120
        packageId:
          type: string
          nullable: true
          description: Id del combo (vuelo + auto + hotel) cuando la reserva forma parte de uno.
          example: PKG-UIO-GYE-0091
        promotionApplied:
          type: boolean
          default: false
        discountPercentage:
          type: number
          minimum: 0
          maximum: 100
          description: Debe ser ≤ `porcentaje_descuento_maximo` del acuerdo B2B.
          example: 10
    SearchRequest:
      type: object
      additionalProperties: false
      required:
        - itineraries
        - passengers
      properties:
        itineraries:
          type: array
          minItems: 1
          maxItems: 6
          description: 1 tramo = solo ida, 2 = ida y vuelta, 3 a 6 = multidestino.
          items:
            type: object
            required:
              - origin
              - destination
              - departureDate
            properties:
              origin:
                type: string
                pattern: ^[A-Z]{3}$
                example: UIO
              destination:
                type: string
                pattern: ^[A-Z]{3}$
                example: GYE
              departureDate:
                type: string
                format: date
                example: '2026-11-20'
        passengers:
          $ref: '#/components/schemas/PassengerBreakdown'
    PassengerBreakdown:
      type: object
      description: Máximo 9 pasajeros con asiento; infantes ≤ adultos (`INFANT_WITHOUT_ADULT`).
      properties:
        adults:
          type: integer
          minimum: 1
          default: 1
          example: 2
        youths:
          type: integer
          minimum: 0
          default: 0
        children:
          type: integer
          minimum: 0
          default: 0
          example: 1
        infants:
          type: integer
          minimum: 0
          default: 0
    SearchResponse:
      type: object
      required:
        - totalOffers
        - offers
      properties:
        totalOffers:
          type: integer
          example: 1
        offers:
          type: array
          items:
            $ref: '#/components/schemas/FlightOffer'
    FlightOffer:
      type: object
      required:
        - offerId
        - airline
        - itineraries
        - grandTotal
      properties:
        offerId:
          type: string
          example: 35c9650e-f055-4b92-88ff-6b8d34739c47
          format: uuid
        airline:
          type: object
          properties:
            code:
              type: string
              example: AV
            name:
              type: string
              example: Avianca Ecuador
        itineraries:
          type: array
          items:
            $ref: '#/components/schemas/ItineraryOption'
        grandTotal:
          $ref: '#/components/schemas/MoneyAmount'
    ItineraryOption:
      type: object
      required:
        - itineraryId
        - totalDurationMinutes
        - stopsCount
        - segments
        - pricingOptions
      properties:
        itineraryId:
          type: string
          example: 6abfd0a8-d419-485a-80ec-177d0c108884
          format: uuid
        totalDurationMinutes:
          type: integer
          example: 55
        stopsCount:
          type: integer
          example: 0
        segments:
          type: array
          items:
            $ref: '#/components/schemas/FlightSegment'
        pricingOptions:
          type: array
          items:
            $ref: '#/components/schemas/CabinPricing'
    FlightSegment:
      type: object
      required:
        - segmentId
        - flightNumber
        - departure
        - arrival
        - marketingCarrier
        - operatingCarrier
      properties:
        segmentId:
          type: string
          example: 2d3443d3-06a9-4418-887b-b4f738ed0ac7
          format: uuid
        flightNumber:
          type: string
          example: AV1632
        departure:
          $ref: '#/components/schemas/FlightEndpoint'
        arrival:
          $ref: '#/components/schemas/FlightEndpoint'
        layoverMinutes:
          type: integer
          nullable: true
        marketingCarrier:
          type: string
          description: Código IATA de la aerolínea comercial.
          example: AV
        operatingCarrier:
          type: string
          description: Código IATA de la aerolínea que opera el vuelo.
          example: AV
        aircraft:
          type: string
          nullable: true
          example: Airbus A320
        durationMinutes:
          type: integer
          minimum: 0
          nullable: true
          example: 55
        status:
          type: string
          nullable: true
          enum:
            - SCHEDULED
            - BOARDING
            - DEPARTED
            - DELAYED
            - ARRIVED
            - CANCELLED
            - DIVERTED
            - null
    FlightEndpoint:
      type: object
      required:
        - iataCode
        - at
      properties:
        iataCode:
          type: string
          pattern: ^[A-Z]{3}$
          example: UIO
        at:
          type: string
          format: date-time
          example: '2026-11-20T08:30:00-05:00'
        terminal:
          type: string
          nullable: true
          example: Nacional
    CabinPricing:
      type: object
      required:
        - cabinClass
        - fareBrand
        - availableSeats
        - fareRules
        - baggageAllowance
        - pricePerPassengerType
      properties:
        cabinClass:
          $ref: '#/components/schemas/CabinClass'
        fareBrand:
          type: string
          example: BASIC
        availableSeats:
          type: integer
          description: Asientos en estado AVAILABLE (mismo valor que se envía por gRPC).
          example: 42
        fareRules:
          type: object
          required:
            - isRefundable
            - isChangeable
          properties:
            isRefundable:
              type: boolean
              example: false
            isChangeable:
              type: boolean
              example: true
        baggageAllowance:
          type: object
          properties:
            personalItemIncluded:
              type: boolean
              example: true
            carryOnIncluded:
              type: integer
              example: 1
            checkedBaggageIncluded:
              type: integer
              example: 0
        extraCheckedBaggagePrice:
          $ref: '#/components/schemas/MoneyAmount'
        pricePerPassengerType:
          type: array
          items:
            type: object
            properties:
              passengerType:
                $ref: '#/components/schemas/PassengerType'
              price:
                $ref: '#/components/schemas/MoneyAmount'
    SeatMapResponse:
      type: object
      description: Mapa de asientos sin precios. Los asientos seleccionables deben corresponder a la cabina adquirida.
      properties:
        segmentId:
          type: string
          example: 2d3443d3-06a9-4418-887b-b4f738ed0ac7
          format: uuid
        cabins:
          type: array
          items:
            type: object
            properties:
              cabinClass:
                $ref: '#/components/schemas/CabinClass'
              rows:
                type: array
                items:
                  type: object
                  properties:
                    rowNumber:
                      type: integer
                      example: 12
                    seats:
                      type: array
                      items:
                        type: object
                        properties:
                          seatNumber:
                            type: string
                            example: 12A
                          isAvailable:
                            type: boolean
                            description: Atajo de v1 — equivale a `status == AVAILABLE`.
                            example: true
                          status:
                            $ref: '#/components/schemas/SeatStatus'
                          characteristics:
                            type: array
                            items:
                              $ref: '#/components/schemas/SeatCharacteristic'
    HoldRequest:
      type: object
      required:
        - offerId
        - itinerarySelections
        - passengersBreakdown
      properties:
        offerId:
          type: string
          example: 35c9650e-f055-4b92-88ff-6b8d34739c47
          format: uuid
        itinerarySelections:
          type: array
          items:
            type: object
            required:
              - itineraryId
              - cabinClass
              - fareBrand
            properties:
              itineraryId:
                type: string
                example: 6abfd0a8-d419-485a-80ec-177d0c108884
                format: uuid
              cabinClass:
                $ref: '#/components/schemas/CabinClass'
              fareBrand:
                type: string
                example: BASIC
        passengersBreakdown:
          $ref: '#/components/schemas/PassengerBreakdown'
        ttlMinutes:
          type: integer
          minimum: 5
          maximum: 30
          default: 15
          description: Minutos que el hold permanece vivo.
    HoldResponse:
      type: object
      required:
        - holdId
        - status
        - expiresAt
        - ttlMinutes
        - lockedPrice
      properties:
        holdId:
          type: string
          format: uuid
          example: 3f1c2a9e-8b7d-4c21-9f0a-6e5d4c3b2a10
        status:
          type: string
          enum:
            - HELD
          example: HELD
        expiresAt:
          type: string
          format: date-time
          example: '2026-10-23T10:15:00Z'
        ttlMinutes:
          type: integer
          example: 15
        lockedPrice:
          $ref: '#/components/schemas/MoneyAmount'
        _links:
          $ref: '#/components/schemas/Links'
    HoldStatusResponse:
      type: object
      required:
        - status
        - remainingSeconds
        - lockedPrice
      properties:
        holdId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/HoldStatus'
        expiresAt:
          type: string
          format: date-time
        remainingSeconds:
          type: integer
          example: 540
        lockedPrice:
          $ref: '#/components/schemas/MoneyAmount'
        _links:
          $ref: '#/components/schemas/Links'
    BookingRequest:
      type: object
      additionalProperties: false
      required:
        - holdId
        - passengers
        - payment
      properties:
        holdId:
          type: string
          format: uuid
          example: 3f1c2a9e-8b7d-4c21-9f0a-6e5d4c3b2a10
        passengers:
          type: array
          minItems: 1
          maxItems: 9
          description: Debe coincidir con `passengersBreakdown` del hold (`PASSENGER_COUNT_MISMATCH`).
          items:
            $ref: '#/components/schemas/PassengerItem'
        payment:
          $ref: '#/components/schemas/PaymentReference'
        salesChannel:
          $ref: '#/components/schemas/SalesChannel'
    PassengerItem:
      type: object
      required:
        - passengerId
        - passengerType
        - firstName
        - lastName
        - documentType
        - documentNumber
        - nationality
        - birthDate
        - gender
        - contact
      properties:
        passengerId:
          type: string
          example: PAX-1
        passengerType:
          $ref: '#/components/schemas/PassengerType'
        associatedAdultId:
          type: string
          description: Obligatorio para INFANT (`INFANT_WITHOUT_ADULT`).
          example: PAX-1
        firstName:
          type: string
          example: María José
        lastName:
          type: string
          example: Andrade Vera
        documentType:
          $ref: '#/components/schemas/DocumentType'
        documentNumber:
          type: string
          example: '1723456789'
        nationality:
          type: string
          example: EC
        documentExpiryDate:
          type: string
          format: date
          description: Debe estar vigente a la fecha del viaje (`DOCUMENT_EXPIRED`). Vuelos internacionales exigen PASSPORT (`PASSPORT_REQUIRED_INTERNATIONAL`).
          example: '2030-05-31'
        birthDate:
          type: string
          format: date
          example: '1995-03-14'
        gender:
          $ref: '#/components/schemas/Gender'
        contact:
          type: object
          required:
            - email
            - phone
          properties:
            email:
              type: string
              format: email
              example: maria.andrade@example.com
            phone:
              type: string
              example: '+593987654321'
        assignedSeats:
          type: array
          items:
            type: object
            required:
              - segmentId
              - seatNumber
            properties:
              segmentId:
                type: string
                example: 2d3443d3-06a9-4418-887b-b4f738ed0ac7
                format: uuid
              seatNumber:
                type: string
                example: 12A
        extraBaggage:
          type: array
          items:
            type: object
            required:
              - itineraryId
              - quantity
            properties:
              itineraryId:
                type: string
                example: 6abfd0a8-d419-485a-80ec-177d0c108884
                format: uuid
              quantity:
                type: integer
                example: 1
    BookingListResponse:
      type: object
      properties:
        nextCursor:
          type: string
          nullable: true
        items:
          type: array
          items:
            type: object
            properties:
              bookingId:
                type: string
                format: uuid
              pnr:
                type: string
                example: XK7P2Q
              status:
                $ref: '#/components/schemas/BookingStatus'
              origin:
                type: string
                example: UIO
              destination:
                type: string
                example: GYE
              departureDate:
                type: string
                format: date
              grandTotal:
                $ref: '#/components/schemas/MoneyAmount'
              _links:
                $ref: '#/components/schemas/Links'
    BookingDetail:
      type: object
      required:
        - bookingId
        - pnr
        - status
        - grandTotal
        - createdAt
      properties:
        bookingId:
          type: string
          format: uuid
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        pnr:
          type: string
          example: XK7P2Q
        status:
          $ref: '#/components/schemas/BookingStatus'
        grandTotal:
          $ref: '#/components/schemas/MoneyAmount'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        holdId:
          type: string
          format: uuid
        paymentReference:
          type: string
          example: PAY-BKP-20261023-000981
        salesChannel:
          $ref: '#/components/schemas/SalesChannel'
        itineraries:
          type: array
          items:
            $ref: '#/components/schemas/ItineraryOption'
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/PassengerItem'
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        changes:
          type: array
          items:
            type: object
            properties:
              changedAt:
                type: string
                format: date-time
              description:
                type: string
        _links:
          $ref: '#/components/schemas/Links'
    TicketSegment:
      type: object
      required:
        - segmentId
        - status
      properties:
        segmentId:
          type: string
          example: 2d3443d3-06a9-4418-887b-b4f738ed0ac7
          format: uuid
        status:
          $ref: '#/components/schemas/TicketSegmentStatus'
        couponNumber:
          type: string
          nullable: true
          example: '1'
        flightNumber:
          type: string
          example: AV1632
        departureIataCode:
          type: string
          example: UIO
        arrivalIataCode:
          type: string
          example: GYE
        departureAt:
          type: string
          format: date-time
        arrivalAt:
          type: string
          format: date-time
        seatNumber:
          type: string
          nullable: true
          example: 12A
    Ticket:
      type: object
      required:
        - ticketId
        - bookingId
        - passengerId
        - status
      properties:
        ticketId:
          type: string
          readOnly: true
          example: 3d815358-7911-465a-8c5f-6afc0daf4a59
          format: uuid
        bookingId:
          type: string
          format: uuid
          readOnly: true
        passengerId:
          type: string
          example: PAX-1
        passengerName:
          type: string
          example: María José Andrade Vera
        eTicketNumber:
          type: string
          nullable: true
          readOnly: true
          example: '1342400012345'
        status:
          $ref: '#/components/schemas/TicketStatus'
        issuedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        segments:
          type: array
          items:
            $ref: '#/components/schemas/TicketSegment'
        failureReason:
          type: string
          nullable: true
          readOnly: true
    TicketListResponse:
      type: object
      required:
        - bookingId
        - tickets
      properties:
        bookingId:
          type: string
          format: uuid
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
    TicketIssuanceResponse:
      type: object
      required:
        - bookingId
        - pnr
        - status
        - tickets
        - issued
