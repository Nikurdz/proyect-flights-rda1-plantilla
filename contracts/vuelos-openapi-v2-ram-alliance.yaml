      description: |
        Retiene inventario de la oferta y congela el precio durante `ttlMinutes` (15 min por defecto, 5–30).
        Los asientos pasan a `HELD`, se emite `hold.created` y se envía `StockChangeEvent` (delta negativo) por gRPC.
        Al vencer, los asientos vuelven a `AVAILABLE` y se emite `hold.expired`.
        **Compensación Saga:** `DELETE /vuelos/offers/hold/{holdId}`.

        **Nota de implementación (RAM Alliance):** `ttlMinutes` 5–30 (15 por defecto). Precio congelado en `lockedPrice`. Oferta vencida: 410 `OFFER_NO_LONGER_AVAILABLE`; sin cupo: 409 `SEAT_TAKEN`. Se emite `hold.created`.
      security:
