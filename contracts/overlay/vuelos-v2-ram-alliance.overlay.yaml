# Parche propio (RFC 7386 JSON Merge Patch) sobre la plantilla de Booking. Lo aplica scripts/build-contract-v2.js.
# `x-operation-notes` no se copia al resultado: cada nota se añade a la descripción de su operación.

info:
  title: RAM Alliance Vuelos — API de vuelos (contrato v2)
  version: 2.0.0-ram-alliance
  license:
    name: Uso académico — Integración de Sistemas PUCE
  contact:
    name: Equipo RAM Alliance Vuelos (PUCE) — David Tapia
  description: |
    # RAM Alliance Vuelos — contrato de integración v2

    > **Sistema proveedor:** RAM Alliance Vuelos (categoría *Vuelos*), detrás de una sola URL base.
    > **Sistema consumidor:** Booking Prototipo (marketplace multimodal).
    > **Base del contrato:** la plantilla común de Booking (`vuelos-openapi-v2.yaml`), **ajustada a lo que este nodo realmente responde**.
    > Este documento se genera con `npm run contract:v2:build` y las respuestas reales de la API se validan contra sus esquemas en las pruebas.

    ## 1. Cómo conectarse
    | Dato | Valor |
    |---|---|
    | URL base | `http://{host}:{port}/api/v2` — endpoints en `/vuelos/...` |
    | Pruebas locales (Tailscale) | `http://100.118.24.48:3000/api/v2/vuelos` |
    | Token OAuth2 | `POST /api/v2/oauth2/token` |
    | Salud (sin token) | `GET /api/v2/vuelos/health` |
    | Documentación navegable | `/api/docs-v2` |
    | `X-API-Key` | **No se usa.** La autenticación es OAuth2 `client_credentials` (Bearer) |

    ## 2. Autenticación
    1. Booking pide un token con su `client_id` y `client_secret` (cuerpo `application/x-www-form-urlencoded` o JSON, o cabecera HTTP Basic).
    2. Envía `Authorization: Bearer <access_token>` en cada llamada. El token dura `expires_in` segundos (3600 por defecto); al vencer se pide otro.
    3. **Scopes:** `flights:read`, `flights:hold`, `flights:book`, `flights:cancel`, `flights:webhooks`, `flights:ops`, `flights:admin` (este último equivale a todos). Un token sin el scope de la operación recibe **403**; sin token, **401**.
    4. Booking identifica al cliente final con `X-User-Id` (hasta 50 caracteres `A-Z a-z 0-9 . _ : @ -`): las reservas, holds y suscripciones quedan a nombre de ese usuario y **solo él las ve** (otro `X-User-Id` recibe 403). Sin `X-User-Id` el dueño es el propio socio. Un webhook registrado **sin** `X-User-Id` recibe los eventos de **todos** los usuarios del socio.
    5. Operaciones públicas (sin token): `search`, `seatmap`, `GET flights/{n}/status`, `health` y el propio `oauth2/token`.

    ## 3. Convenciones
    * **Ids generados por este nodo son UUID**: `offerId`, `itineraryId`, `segmentId` (= id del vuelo), `holdId`, `bookingId`, `ticketId`, `quoteId`, `changeOfferId`, `refundId`. Use siempre los valores que devuelve la API (los ejemplos con prefijo `OFF-`/`SEG-`… de la plantilla no existen aquí).
    * **Ids que elige Booking:** `passengerId`, `paymentReference` (8–100 caracteres `A-Za-z0-9._:-`, de un solo uso), `partnerOrderId`, `packageId`.
    * **Idempotency-Key** (UUID v4) obligatoria en las escrituras que lo indican: se retiene 24 h. Mismo cuerpo → misma respuesta, con `Idempotent-Replayed: true` y código **200**; otro cuerpo con la misma clave → **409 `IDEMPOTENCY_KEY_REUSED`**.
    * **Trazabilidad:** `X-Correlation-Id` (8–100 caracteres `A-Za-z0-9._-`) se acepta y se devuelve sin cambios; si no viene o es inválido se genera uno. `X-Request-Id` identifica cada llamada. Todo error trae `correlation_id`, `instance` y `timestamp` (RFC 7807).
    * **Búsqueda:** `X-Device-Fingerprint` obligatorio y no vacío.
    * **Límite de tasa:** 300 peticiones por 60 s **por dirección IP** del cliente; al excederlo, **429** con `Retry-After`. `health` está exento.
    * **Paginación:** `limit` y `cursor` opacos (`nextCursor`); `GET /bookings` por defecto 10 (máx. 50), `operaciones/vuelos` por defecto 20 (máx. 100), `eventos` por defecto 20 (máx. 100).
    * **Dinero:** cadenas con dos decimales y moneda ISO-4217 (`USD`). Solo se vende en **clase ECONÓMICA**, vuelos directos.
    * **Pagos:** cobra Booking; este nodo solo recibe `payment.paymentReference` (y opcionalmente `amount`: si no coincide con el precio retenido, **422 `AMOUNT_MISMATCH`**). En cancelaciones el nodo **calcula** el reembolso y Booking lo ejecuta.

    ## 4. Eventos que publica este nodo (webhooks CloudEvents)
    Se registran con `POST /vuelos/webhooks` (la `url` debe ser **https** a una IP pública; en las pruebas locales por Tailscale el nodo se arranca con `WEBHOOKS_ALLOW_PRIVATE_HOSTS=true`). Cada entrega es un `POST` con el CloudEvent v1.0 estructurado:

    | Cabecera | Valor |
    |---|---|
    | `Content-Type` | `application/cloudevents+json` |
    | `X-Webhook-Id` | id de la entrega |
    | `X-Webhook-Event` | tipo corto (`booking.confirmed`…) |
    | `X-Webhook-Timestamp` | epoch en segundos (**no** forma parte de la firma) |
    | `X-Webhook-Signature` | `sha256=` + HMAC-SHA256(secret, **cuerpo crudo**) en hexadecimal |
    | `X-Correlation-Id` | `correlationid` del evento |

    Responda **2xx**; cualquier otra respuesta se reintenta a 1 min, 5 min, 30 min, 2 h y 6 h y luego la entrega queda `DEAD` (el evento sigue en `GET /vuelos/eventos`). Los 15 tipos y su `data` están en los esquemas `Event*`. `type` = `ec.edu.epn.booking.vuelos.<evento>`, `source` = `/aerolineas/ram-alliance/vuelos`.

    ## 5. Eventos que consume este nodo (publica Booking) — ver `x-asyncapi-inbound`
    ## 6. Stock por gRPC (este nodo es el cliente) — ver `x-grpc-stock`

    ## 7. Diferencias respecto a la plantilla de Booking
    | Tema | Plantilla | Este nodo |
    |---|---|---|
    | Ids | ejemplos `OFF-…`, `SEG-…`, `TKT-…`… | UUID (ver §3) |
    | 202 (`TICKET_ISSUING`, `CHANGE_PENDING`, `CANCELLATION_PENDING`) | posible | **nunca**: la emisión, el equipaje, el cambio de fecha y la cancelación son síncronos |
    | `BookingDetail.itineraries` / `passengers` | opcionales | **no se devuelven** (no se exponen datos personales) |
    | Check-in repetido | 409 | **200 idempotente** (no cambia nada). Cierra a la hora de salida si el nodo corre con `CHECKIN_CLOSES_HOURS=0` |
    | Cancelación sin `quoteId` | solo SAGA/FLIGHT | también `CUSTOMER_REQUEST`: se cotiza y aplica en el acto |
    | Límite de tasa de `search` | por `X-Device-Fingerprint` | por IP |
    | `health.circuit_breaker_estado` | real | siempre `CLOSED` |
    | `aircraft` en operaciones | modelo | `null` |
    | Mapa de asientos | `HELD` por asiento | un hold no fija asientos concretos: `AVAILABLE`, `BOOKED`/`TICKETED`, `CHECKED_IN`, `BOARDED` |
    | Asientos | con costo opcional | gratis; `payment` se acepta pero no se usa |

    ## 8. Máquinas de estado
    **Asiento:** `AVAILABLE → BOOKED/TICKETED → CHECKED_IN → BOARDED`. **Hold:** `HELD → CONSUMED | RELEASED | EXPIRED` (TTL 5–30 min, 15 por defecto; vencido = **410 `HOLD_EXPIRED`**). **Reserva:** `CONFIRMED`, `CANCELLED`, `FAILED` (y los estados transitorios del contrato). **Vuelo:** `SCHEDULED → BOARDING → DEPARTED → ARRIVED`, con `DELAYED`, `CANCELLED`, `DIVERTED`. **Check-in:** abre 48 h antes de la salida.

servers:
  - url: http://{host}:{port}/api/v2
    description: Este nodo. Por defecto, la laptop del equipo en la red Tailscale (pruebas de integración).
    variables:
      host:
        default: 100.118.24.48
        description: IP de Tailscale (o nombre de host) donde corre el nodo
      port:
        default: '3000'
        description: Puerto del nodo
  - url: /api/v2
    description: Ruta relativa canónica (detrás del gateway del nodo)

tags:
  - name: MS.Vuelos — Búsqueda y Catálogo
    description: Búsqueda multidestino, mapa de asientos y estado público de vuelos.
  - name: MS.Vuelos — Operaciones
    description: Panel de ocupación por vuelo y cabina y cambio de estado operativo (scope flights:ops).
  - name: MS.Vuelos — Promociones B2B
    description: Acuerdo comercial de promociones y combos con Booking Prototipo.
  - name: MS.Vuelos — Telemetría
    description: Salud del nodo y feed outbox de eventos.
  - name: MS.Reservas — Bloqueo de Cupos (Hold)
    description: Retención temporal de asientos con precio congelado y TTL.
  - name: MS.Reservas — Reservas y Emisión
    description: Creación de reservas con paymentReference, consulta y emisión de boletos.
  - name: MS.Reservas — Asientos, Check-in y Boarding Pass
    description: Cambio de asiento, check-in en línea y pases de abordar.
  - name: MS.Postventa
    description: Equipaje extra, cambio de fecha, cotización y cancelación.
  - name: MS.Clientes — Webhooks
    description: Suscripciones para recibir eventos CloudEvents firmados.
  - name: MS.Clientes — OAuth2
    description: Token de servicio (client_credentials) para Booking Prototipo.

