  /disponibilidad:
    get:
      description: >-
        RF-SHP-004..024. Los criterios son los parámetros del enlace profundo (origin, destination, outbound, inbound, adt, chd, inf, trip,
        cabin, sort). Un trayecto sin vuelos se devuelve vacío con fechas alternativas, no como error. Solo vuelos directos en cabina
        económica.
      operationId: CatalogoController_disponibilidad
      parameters:
        - description: Origen. Si se omite, cualquier origen.
          in: query
          name: origin
          required: false
          schema:
            example: BOG
            type: string
        - description: Destino. Si se omite, cualquier destino.
          in: query
          name: destination
          required: false
          schema:
            example: SCL
            type: string
        - description: Fecha de ida. Si se omite, mañana.
          in: query
          name: outbound
          required: false
          schema:
            format: date
            type: string
        - description: Fecha de vuelta (ida y vuelta)
          in: query
          name: inbound
          required: false
          schema:
            format: date
            type: string
        - in: query
          name: adt
          required: false
          schema:
            default: 1
            maximum: 50
            minimum: 1
            type: number
        - description: Niños
          in: query
          name: chd
          required: false
          schema:
            default: 0
            maximum: 50
            minimum: 0
            type: number
        - description: Infantes sin asiento
          in: query
          name: inf
          required: false
          schema:
            default: 0
            maximum: 50
            minimum: 0
            type: number
        - description: RT ida y vuelta; OW solo ida. Se infiere de `inbound` si se omite.
          in: query
          name: trip
          required: false
          schema:
            enum:
              - RT
              - OW
            type: string
        - in: query
          name: cabin
          required: false
          schema:
            default: ECONOMY
            enum:
              - ECONOMY
              - PREMIUM_ECONOMY
              - BUSINESS
              - FIRST
            type: string
        - in: query
          name: sort
          required: false
          schema:
            default: RECOMENDADO
            enum:
              - RECOMENDADO
              - MAS_BARATOS
              - MAS_RAPIDOS
              - SALIDA_TEMPRANO
              - SALIDA_TARDE
              - LLEGADA_TEMPRANO
              - LLEGADA_TARDE
            type: string
        - in: query
          name: mercado
          required: false
          schema:
            default: ec
            example: ec
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibilidadViewDto'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Petición inválida
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No encontrado
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Entidad no procesable
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Servicio no disponible
      summary: Buscar vuelos disponibles
      tags:
        - E-commerce · Búsqueda
