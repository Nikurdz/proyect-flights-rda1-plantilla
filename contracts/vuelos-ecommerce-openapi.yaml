          description: Localizador de la reserva (RN-20).
          nullable: true
          type: string
        total:
          $ref: '#/components/schemas/MontoDto'
      required:
        - ordenId
        - numeroOrden
        - estado
        - mercado
        - total
        - itinerarios
        - pasajeros
        - pago
        - creadaEn
        - historial
      type: object
    OrdenesPaginaViewDto:
      properties:
        items:
          items:
            $ref: '#/components/schemas/OrdenViewDto'
          type: array
        nextCursor:
          type: string
      required:
        - items
      type: object
    PasajeroDto:
      properties:
        apellidos:
          type: string
        asientos:
          description: Asiento opcional por trayecto; los infantes en brazos no ocupan asiento.
          items:
            $ref: '#/components/schemas/AsientoElegidoDto'
          type: array
        asociadoA:
          description: id del adulto con el que viaja un infante.
          type: string
        documento:
          $ref: '#/components/schemas/DocumentoDto'
        fechaNacimiento:
          format: date
          type: string
        genero:
          enum:
            - M
            - F
            - X
          type: string
        id:
          description: Identificador elegido por el cliente, único en la oferta.
          type: string
        nacionalidad:
          description: ISO 3166-1 alpha-2
          example: EC
          type: string
        necesidades:
          items:
            enum:
              - MOVILIDAD_REDUCIDA
              - MENOR_NO_ACOMPANADO
              - ALIMENTACION_ESPECIAL
              - MASCOTA
            type: string
          type: array
        nombres:
          description: Debe coincidir con el documento de viaje (RN-15).
          type: string
        numeroSocio:
          description: 'RF-CHK-006: número LATAM Pass del pasajero.'
          type: string
        tipo:
          enum:
            - ADULT
            - YOUTH
            - CHILD
            - INFANT
          type: string
      required:
        - id
        - tipo
        - nombres
        - apellidos
        - fechaNacimiento
        - genero
        - nacionalidad
        - documento
      type: object
    PasajeroOrdenViewDto:
      properties:
        apellidos:
          type: string
        asientos:
          description: Asientos elegidos, uno por trayecto.
          items:
            $ref: '#/components/schemas/AsientoOrdenViewDto'
          type: array
        eTicket:
          description: Billete electrónico de 13 dígitos (RF-ORD-003).
          nullable: true
          type: string
        id:
          type: string
        nombres:
          type: string
        qr:
          description: Texto firmado del código QR del pasajero (v1.<billete>.<PNR>.<firma>); sin datos personales.
          type: string
        tipo:
          type: string
      required:
        - id
        - tipo
        - nombres
        - apellidos
      type: object
    PasajeroRegistradoDto:
      properties:
        apellidos:
          type: string
        asientos:
          items:
            $ref: '#/components/schemas/AsientoElegidoDto'
          type: array
        id:
          type: string
        nombres:
          type: string
        tipo:
          type: string
      required:
        - id
        - tipo
        - nombres
        - apellidos
      type: object
    PassengerBreakdownDto:
      properties:
        adults:
          default: 1
          example: 1
          maximum: 50
          minimum: 1
          type: number
        children:
          default: 0
          example: 0
          maximum: 50
          minimum: 0
          type: number
        infants:
          default: 0
          example: 0
          maximum: 50
          minimum: 0
          type: number
        youths:
          default: 0
          example: 0
          maximum: 50
          minimum: 0
          type: number
      type: object
    PassengerContactDto:
      properties:
        email:
          format: email
          type: string
        phone:
          description: E.164 phone number
          example: '+593999999999'
          type: string
      required:
        - email
        - phone
      type: object
    PassengerItemDto:
      properties:
        assignedSeats:
          items:
            $ref: '#/components/schemas/SeatAssignmentDto'
          type: array
        associatedAdultId:
          description: passengerId of the adult an INFANT travels with
          type: string
        birthDate:
          format: date
          type: string
        contact:
          $ref: '#/components/schemas/PassengerContactDto'
        documentExpiryDate:
          format: date
          type: string
        documentNumber:
          type: string
        documentType:
          enum:
            - PASSPORT
            - NATIONAL_ID
          type: string
        extraBaggage:
          items:
            $ref: '#/components/schemas/ExtraBaggageDto'
          type: array
        firstName:
          type: string
        gender:
          enum:
            - M
            - F
            - X
          type: string
        lastName:
          type: string
        nationality:
          description: ISO 3166-1 alpha-2
          example: EC
          type: string
        passengerId:
          description: Caller-chosen id, unique within the booking
          type: string
        passengerType:
          enum:
            - ADULT
            - YOUTH
            - CHILD
            - INFANT
          type: string
      required:
        - passengerId
        - passengerType
        - firstName
        - lastName
        - documentType
        - documentNumber
        - nationality
        - birthDate
        - gender
        - contact
      type: object
    PaymentReferenceDto:
      properties:
        paymentReference:
          description: Referencia a un pago gestionado por la Payment API
          pattern: ^[A-Za-z0-9._:-]{8,100}$
          type: string
      required:
        - paymentReference
      type: object
    PreferenciasDto:
      properties:
        canalNotificacion:
          enum:
            - EMAIL
            - SMS
            - PUSH
            - WHATSAPP
          type: string
        consentimientoMarketing:
          type: boolean
        idioma:
          example: es
          type: string
        mercado:
          example: ec
          type: string
      type: object
    PriceDifferenceDto:
      properties:
        changeFee:
          example: '30.00'
          type: string
        fareDifference:
          description: Negative when the new flight is cheaper; it is never refunded.
          example: '40.00'
          type: string
        taxDifference:
          example: '6.00'
          type: string
        totalToPay:
          description: 'What has to be paid: the difference (never below zero) plus the fee.'
          example: '76.00'
          type: string
      required:
        - fareDifference
        - taxDifference
        - changeFee
        - totalToPay
      type: object
    PricePerPassengerTypeDto:
      properties:
        passengerType:
          enum:
            - ADULT
            - YOUTH
            - CHILD
            - INFANT
          type: string
        price:
          $ref: '#/components/schemas/MoneyAmountDto'
      required:
        - passengerType
        - price
      type: object
    ProblemDetailsDto:
      properties:
        code:
          description: >-
            The contract's ProblemDetails.code enum, plus
            UNAUTHORIZED/FORBIDDEN/NOT_FOUND/CONFLICT/INTERNAL_ERROR/NOT_IMPLEMENTED/SERVICE_UNAVAILABLE for statuses the contract does not
            define.
          example: SEAT_TAKEN
          type: string
        detail:
          type: string
        invalidParams:
          items:
            $ref: '#/components/schemas/InvalidParamDto'
          type: array
        status:
          example: 409
          type: number
        title:
          type: string
        type:
          example: https://api.booking-hub.com/errors/seat-taken
          type: string
      required:
        - type
        - title
        - status
        - code
      type: object
    RegistrarPasajerosDto:
      properties:
        contacto:
          $ref: '#/components/schemas/ContactoDto'
        pasajeros:
          items:
            $ref: '#/components/schemas/PasajeroDto'
          type: array
      required:
        - pasajeros
        - contacto
      type: object
    RegistroClienteDto:
      properties:
        aceptaTerminos:
          description: 'Debe ser true: aceptación de términos y política de datos.'
          type: boolean
        apellidos:
          type: string
        consentimientoMarketing:
          default: false
          description: 'Consentimiento de marketing: separado y no obligatorio.'
          type: boolean
        contrasena:
          description: Mínimo 10 caracteres, con al menos una letra y un número.
          minLength: 10
          type: string
        correo:
          format: email
          type: string
        fechaNacimiento:
          format: date
          type: string
        mercado:
          default: ec
          example: ec
          type: string
        nombres:
          type: string
        telefono:
          description: E.164
          example: '+593999999999'
          type: string
      required:
        - correo
        - contrasena
        - nombres
        - apellidos
        - fechaNacimiento
        - aceptaTerminos
      type: object
    ReglasRegulatoriasDto:
      properties:
        desistimiento:
          $ref: '#/components/schemas/DesistimientoDto'
        retracto:
          allOf:
            - $ref: '#/components/schemas/RetractoDto'
          example:
            diasHabiles: 5
        traspaso:
          $ref: '#/components/schemas/TraspasoDto'
      type: object
    RetractoDto:
      properties: {}
      type: object
    RevalidacionViewDto:
      properties:
        cambioDePrecio:
          description: 'RF-CRT-003: si el precio cambió, el flujo se detiene hasta que el cliente acepte.'
          type: boolean
        precioAnterior:
          $ref: '#/components/schemas/MontoDto'
        precioNuevo:
          $ref: '#/components/schemas/MontoDto'
        venceEn:
          type: string
        vigente:
          type: boolean
      required:
        - vigente
        - cambioDePrecio
        - precioAnterior
        - precioNuevo
        - venceEn
      type: object
    SearchRequestDto:
      properties:
        itineraries:
          items:
            $ref: '#/components/schemas/ItinerarySearchDto'
          maxItems: 6
          minItems: 1
          type: array
        passengers:
          $ref: '#/components/schemas/PassengerBreakdownDto'
      required:
        - itineraries
        - passengers
      type: object
    SearchResponseDto:
      properties:
        offers:
          items:
            $ref: '#/components/schemas/FlightOfferDto'
          type: array
        totalOffers:
          type: number
      required:
        - totalOffers
        - offers
      type: object
    SeatAssignmentDto:
      properties:
        seatNumber:
          example: 14C
          pattern: ^\d{1,3}[A-F]$
          type: string
        segmentId:
          description: segmentId as returned by /search (the flight segment).
          format: uuid
          type: string
      required:
        - segmentId
        - seatNumber
      type: object
    SeleccionTrayectoDto:
      properties:
        familia:
          example: LIGHT
          type: string
        itinerarioId:
          description: itinerarioId devuelto por /disponibilidad
          format: uuid
          type: string
      required:
        - itinerarioId
        - familia
      type: object
    TarifasViewDto:
      properties:
        familias:
          items:
            $ref: '#/components/schemas/FamiliaTarifariaDto'
          type: array
        itinerarioId:
          format: uuid
          type: string
        mercado:
          type: string
        moneda:
          type: string
        vigenteHasta:
          description: 'RF-PRC-009: la cotización vale hasta este instante.'
          type: string
      required:
        - itinerarioId
        - mercado
        - moneda
        - vigenteHasta
        - familias
      type: object
    TextosLegalesDto:
      properties:
        condicionesTransporte:
          $ref: '#/components/schemas/DocumentoLegalDto'
        privacidad:
          $ref: '#/components/schemas/DocumentoLegalDto'
        razonSocial:
          type: string
        terminos:
          $ref: '#/components/schemas/DocumentoLegalDto'
      required:
        - razonSocial
        - terminos
        - privacidad
        - condicionesTransporte
      type: object
    TicketResponseDto:
      properties:
        bookingId:
          format: uuid
          type: string
        eTicketNumber:
          nullable: true
          type: string
        issuedAt:
          nullable: true
          type: string
        passengerId:
          type: string
        qrPayload:
          description: Texto firmado para el código QR del pasajero (v1.<billete>.<PNR>.<firma>); no contiene datos personales.
          nullable: true
          readOnly: true
          type: string
        status:
          enum:
            - PENDING
            - ISSUING
            - ISSUED
            - FAILED
            - VOIDED
            - REFUNDED
          type: string
        ticketId:
          type: string
      required:
        - ticketId
        - bookingId
        - passengerId
        - status
      type: object
    TokenViewDto:
      properties:
        accessToken:
          type: string
        expiresIn:
          description: Segundos de vigencia.
          type: number
        tokenType:
          example: Bearer
          type: string
      required:
        - accessToken
        - tokenType
        - expiresIn
      type: object
    TraspasoDto:
      properties: {}
      type: object
    TrayectoDisponibleDto:
      properties:
        destino:
          description: null si la búsqueda no fijó destino.
          nullable: true
          type: string
        fecha:
          format: date
          type: string
        fechasAlternativas:
          description: 'RF-SHP-024: fechas cercanas con vuelos cuando este trayecto no tiene disponibilidad.'
          items:
            $ref: '#/components/schemas/FechaAlternativaDto'
          type: array
        itinerarios:
          items:
            $ref: '#/components/schemas/ItinerarioDto'
          type: array
        origen:
          description: null si la búsqueda no fijó origen.
          nullable: true
          type: string
        sentido:
          enum:
            - IDA
            - VUELTA
          type: string
      required:
        - sentido
        - fecha
        - itinerarios
      type: object
    TrayectoViewDto:
      properties:
        destino:
          type: string
        familia:
          type: string
        itinerarioId:
          type: string
        llegada:
          type: string
        numeroVuelo:
          type: string
        origen:
          type: string
        salida:
          type: string
        total:
          $ref: '#/components/schemas/MontoDto'
      required:
        - itinerarioId
        - numeroVuelo
        - origen
        - destino
        - salida
        - llegada
        - familia
        - total
      type: object
    VerificacionBilleteViewDto:
      properties:
        estado:
          example: ISSUED
          type: string
        itinerarios:
          description: Sin nombres ni datos de contacto.
          items:
            $ref: '#/components/schemas/ItinerarioVerificadoDto'
          type: array
        pnr:
          type: string
        valido:
          description: false si el código no es auténtico o no corresponde a un billete emitido.
          type: boolean
      required:
        - valido
      type: object
    VerificarCorreoDto:
      properties:
        token:
          description: Token de un solo uso recibido por correo.
          type: string
      required:
        - token
      type: object
    VincularOrdenDto:
      properties:
        apellido:
          description: Apellido de cualquier pasajero.
          example: Tapia
          type: string
        numero:
          example: ORD-7K3M9PQ2XA
          type: string
        pnr:
          description: Código de reserva (PNR)
          example: ABC123
          type: string
      required:
        - apellido
      type: object
    WebhookSubscriptionDto:
      properties:
        events:
          items:
            enum:
              - booking.confirmed
              - booking.failed
              - booking.changed
              - booking.cancelled
              - booking.baggage_added
              - hold.expired
              - flight.schedule_changed
              - flight.cancelled
              - booking.ticket_issuing
              - booking.ticket_issued
              - booking.ticket_failed
              - booking.checked_in
            type: string
          type: array
        secret:
          description: Shared secret used to sign deliveries (HMAC-SHA256).
          minLength: 16
          type: string
        url:
          format: uri
          type: string
      required:
        - url
        - events
        - secret
      type: object
    WebhookSubscriptionViewDto:
      properties:
        events:
          items:
            enum:
              - booking.confirmed
              - booking.failed
              - booking.changed
              - booking.cancelled
              - booking.baggage_added
              - hold.expired
              - flight.schedule_changed
              - flight.cancelled
              - booking.ticket_issuing
              - booking.ticket_issued
              - booking.ticket_failed
              - booking.checked_in
            type: string
          type: array
        id:
          format: uuid
          type: string
        url:
          format: uri
          type: string
      required:
        - id
        - url
        - events
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
