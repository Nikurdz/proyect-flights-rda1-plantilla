  /webhooks:
    get:
      description: 'Scope de referencia: flights:webhooks. El secreto nunca se devuelve.'
      operationId: VuelosController_listWebhooks
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/WebhookSubscriptionViewDto'
                type: array
          description: Suscripciones activas
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No autenticado
      security:
        - bearer: []
      summary: Listar mis suscripciones
      tags:
        - Webhooks
    post:
      description: >-
        Scope de referencia: flights:webhooks. Solo URLs https que resuelvan a direcciones públicas (se rechazan localhost y redes
        privadas). Cada entrega es un POST con X-Webhook-Id, X-Webhook-Event, X-Webhook-Timestamp y X-Webhook-Signature =
        sha256=HMAC(secret, timestamp.cuerpo); se reintenta 5 veces (1 min, 5 min, 30 min, 2 h, 6 h). Máximo 10 por cuenta.
      operationId: VuelosController_registerWebhook
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionDto'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionViewDto'
          description: Webhook registrado
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Petición inválida
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No autenticado
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Entidad no procesable
      security:
        - bearer: []
      summary: Registrar un webhook
      tags:
        - Webhooks
  /webhooks/{id}:
    delete:
      description: 'Scope de referencia: flights:webhooks. Las entregas pendientes de esa suscripción se descartan.'
      operationId: VuelosController_deleteWebhook
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: Eliminado
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Petición inválida
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No autenticado
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No encontrado
      security:
        - bearer: []
      summary: Eliminar un webhook
      tags:
        - Webhooks
components:
  schemas:
    AceptarCondicionesDto:
      properties:
        versionCondicionesTransporte:
          example: 2026-10
          type: string
        versionTerminos:
          description: Versión de los términos que el comprador vio (debe ser la vigente del mercado).
          example: 2026-10
          type: string
      required:
        - versionTerminos
        - versionCondicionesTransporte
      type: object
    AceptarPrecioDto:
      properties:
        totalAceptado:
          description: El nuevo total, tal como lo devolvió la revalidación.
          example: '1371000'
          type: string
      required:
        - totalAceptado
      type: object
    ActualizarMercadoDto:
      properties:
        activo:
          type: boolean
        identificacionesFiscales:
          items:
            $ref: '#/components/schemas/IdentificacionFiscalDto'
          type: array
        mediosPago:
          items:
            $ref: '#/components/schemas/MedioPagoDto'
          type: array
        nombre:
          type: string
        productosBuscador:
          example:
            - VUELOS
            - ALOJAMIENTOS
          items:
            type: string
          type: array
        reglasRegulatorias:
          $ref: '#/components/schemas/ReglasRegulatoriasDto'
        textosLegales:
          $ref: '#/components/schemas/TextosLegalesDto'
        tipoCambioDesdeUsd:
          description: Unidades de la moneda del mercado por 1 USD.
          type: number
        versionEsperada:
          description: Versión del mercado sobre la que se basa la edición (control optimista).
          type: number
      required:
        - versionEsperada
      type: object
    AddBaggageRequestDto:
      properties:
        itineraryId:
          description: itineraryId of the leg the bags travel on.
          format: uuid
          type: string
        passengerId:
          description: passengerId chosen in the booking request.
          type: string
        payment:
          $ref: '#/components/schemas/PaymentReferenceDto'
        quantity:
          description: El tope real lo fija POSTSALE_BAGGAGE_MAX_PER_LEG (409 BAGGAGE_LIMIT_EXCEEDED).
          maximum: 10
          minimum: 1
          type: number
      required:
        - passengerId
        - itineraryId
        - quantity
        - payment
      type: object
    AdminAccionVueloViewDto:
      properties:
        codigoVuelo:
          example: LA800
          type: string
        estado:
          enum:
            - SCHEDULED
            - CANCELLED
          type: string
        eventos:
          description: Eventos de webhook emitidos.
          items:
            type: string
          type: array
        reservasAfectadas:
          description: Reservas confirmadas que tenían este vuelo y fueron actualizadas o canceladas.
          type: number
        salida:
          type: string
        vueloId:
          format: uuid
          type: string
      required:
        - vueloId
        - codigoVuelo
        - estado
        - salida
        - reservasAfectadas
        - eventos
      type: object
    AdminActualizarVueloDto:
      properties:
        aerolinea:
          example: LATAM Airlines
          type: string
        capacidadTotal:
          description: No puede ser menor que los asientos ya vendidos ni dejar asientos numerados fuera de la cabina.
          maximum: 400
          minimum: 1
          type: number
        duracionMinutos:
          description: Recalcula la llegada conservando la salida.
          maximum: 1500
          minimum: 20
          type: number
        precioBaseUsd:
          description: Tarifa base por adulto en USD. No afecta a las reservas ya hechas.
          example: 340
          type: number
      type: object
    AdminAsientoMapaDto:
      properties:
        characteristics:
          items:
            type: string
          type: array
        isAvailable:
          type: boolean
        seatNumber:
          example: 12A
          type: string
      required:
        - seatNumber
        - isAvailable
        - characteristics
      type: object
    AdminAsientoReservadoDto:
      properties:
        asiento:
          example: 12A
          type: string
        numeroOrden:
          description: Orden del e-commerce, si la reserva salió de una.
          example: ORD-7K3M9PQ2XA
          nullable: true
          type: string
        pnr:
          description: Código de reserva que lo tiene (sin nombres).
          example: ABC234
          type: string
      required:
        - asiento
        - pnr
      type: object
    AdminAsientosVueloDto:
      properties:
        capacidadTotal:
          type: number
        codigoVuelo:
          example: LA800
          type: string
        destino:
          example: SCL
          type: string
        filas:
          description: Mapa completo de la cabina con la disponibilidad de cada asiento.
          items:
            $ref: '#/components/schemas/AdminFilaMapaDto'
          type: array
        origen:
          example: BOG
          type: string
        reservados:
          description: Asientos reservados, por número.
          items:
            $ref: '#/components/schemas/AdminAsientoReservadoDto'
          type: array
        salida:
          type: string
        vueloId:
          format: uuid
          type: string
      required:
        - vueloId
        - codigoVuelo
        - origen
        - destino
        - salida
        - capacidadTotal
        - reservados
        - filas
      type: object
    AdminCambiarRolesDto:
      properties:
        roles:
          description: Roles que debe tener el usuario. CUSTOMER siempre se conserva.
          example:
            - CUSTOMER
            - ADMIN
          items:
            enum:
              - CUSTOMER
              - ADMIN
            type: string
          type: array
      required:
        - roles
      type: object
    AdminCancelarVueloDto:
      properties:
        motivo:
          example: Falla técnica de la aeronave
          type: string
      type: object
    AdminCrearUsuarioDto:
      properties:
        apellidos:
          type: string
        contrasena:
          description: Mínimo 10 caracteres, con al menos una letra y un número.
          minLength: 10
          type: string
        correo:
          format: email
          type: string
        fechaNacimiento:
          format: date
          type: string
        nombres:
          type: string
        roles:
          default:
            - CUSTOMER
          description: Todo usuario conserva CUSTOMER; agrega ADMIN para crear un administrador.
          items:
            enum:
              - CUSTOMER
              - ADMIN
            type: string
          type: array
        telefono:
          description: E.164
          example: '+593999999999'
          type: string
      required:
        - correo
        - contrasena
        - nombres
        - apellidos
        - fechaNacimiento
      type: object
    AdminCrearVueloDto:
      properties:
        aerolinea:
          example: LATAM Airlines
          type: string
        capacidad:
          default: 180
          description: Asientos de la cabina; todos quedan disponibles.
          example: 180
          maximum: 400
          minimum: 1
          type: number
        codigoVuelo:
          description: Dos caracteres de aerolínea y 1 a 4 dígitos. Los dos primeros son el código de la aerolínea.
          example: LA900
          type: string
        destino:
          example: SCL
          type: string
        duracionMinutos:
          example: 300
          maximum: 1500
          minimum: 20
          type: number
        origen:
          description: Código IATA, debe existir en el catálogo de localidades.
          example: BOG
          type: string
        precioBaseUsd:
          description: Tarifa base por adulto en USD, antes de familia e impuestos.
          example: 320
          type: number
        salida:
          description: Salida (UTC), en el futuro.
          example: '2026-11-20T14:30:00.000Z'
          type: string
      required:
        - codigoVuelo
        - aerolinea
        - origen
        - destino
        - salida
        - duracionMinutos
        - precioBaseUsd
      type: object
    AdminFilaMapaDto:
      properties:
        rowNumber:
          type: number
        seats:
          items:
            $ref: '#/components/schemas/AdminAsientoMapaDto'
          type: array
      required:
        - rowNumber
        - seats
      type: object
    AdminOrdenViewDto:
      properties:
        _links:
          additionalProperties:
            format: uri
            type: string
          description: HATEOAS links (Richardson Maturity Model Level 3)
          type: object
        bookingId:
          description: >-
            Reserva del núcleo de vuelos tras la emisión: es el `bookingId` de las rutas de equipaje, cambio, cancelación, check-in y pases.
            Solo en la vista del propietario.
          format: uuid
          type: string
        canal:
          type: string
        clienteId:
          description: Cuenta del comprador; null si compró como invitado.
          format: uuid
          nullable: true
          type: string
        comprador:
          enum:
            - cliente
            - invitado
          type: string
        contacto:
          description: Solo en la vista del propietario; la recuperación pública lo enmascara.
          type: object
        creadaEn:
          type: string
        estado:
          enum:
            - PENDIENTE_PAGO
            - PAGO_EN_VERIFICACION
            - PAGADA
            - EMITIDA
            - FALLIDA_COMPENSADA
            - MODIFICADA
            - DEVOLUCION_EN_CURSO
            - REEMBOLSADA
            - EN_VIAJE
            - COMPLETADA
            - EXPIRADA
          type: string
        historial:
          items:
            type: string
          type: array
        itinerarios:
          items:
            $ref: '#/components/schemas/ItinerarioOrdenDto'
          type: array
        mercado:
          type: string
        numeroOrden:
          example: ORD-7K3M9PQ2XA
          type: string
        ordenId:
          format: uuid
          type: string
        pago:
          type: object
        pasajeros:
          items:
            $ref: '#/components/schemas/PasajeroOrdenViewDto'
          type: array
        pnr:
          description: Localizador de la reserva (RN-20).
          nullable: true
          type: string
        total:
          $ref: '#/components/schemas/MontoDto'
      required:
        - ordenId
        - numeroOrden
        - estado
        - mercado
        - total
        - itinerarios
        - pasajeros
        - pago
        - creadaEn
        - historial
        - comprador
        - canal
      type: object
    AdminOrdenesPaginaDto:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AdminOrdenViewDto'
          type: array
        nextCursor:
          type: string
      required:
        - items
      type: object
    AdminReprogramarVueloDto:
      properties:
        motivo:
          example: Cambio de franja operativa
          type: string
        nuevaSalida:
          description: Nueva hora de salida (UTC), en el futuro. La llegada se recalcula conservando la duración.
          example: '2026-11-20T14:30:00.000Z'
          type: string
      required:
        - nuevaSalida
      type: object
    AdminUsuarioViewDto:
      properties:
        apellidos:
          type: string
        bloqueada:
          description: La cuenta está bloqueada temporalmente por intentos fallidos de inicio de sesión.
          type: boolean
        clienteId:
          format: uuid
          type: string
        correo:
          type: string
        correoVerificado:
          type: boolean
        creadoEn:
          type: string
        nombres:
          type: string
        roles:
          items:
            enum:
              - CUSTOMER
              - ADMIN
            type: string
          type: array
      required:
        - clienteId
        - correo
        - nombres
        - apellidos
        - roles
        - correoVerificado
        - bloqueada
        - creadoEn
      type: object
    AdminUsuariosPaginaDto:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AdminUsuarioViewDto'
          type: array
        limite:
          type: number
        pagina:
          type: number
        total:
          type: number
      required:
        - items
        - total
        - pagina
        - limite
      type: object
    AdminVueloViewDto:
      properties:
        aerolinea:
          type: string
        asientosDisponibles:
          type: number
        asientosReservados:
          description: Asientos con número ya reservados (los pasajeros que no eligieron asiento no cuentan).
          type: number
        capacidadTotal:
          type: number
        codigoVuelo:
          example: LA800
          type: string
        destino:
          example: SCL
          type: string
        duracionMinutos:
          type: number
        estado:
          description: Un vuelo cancelado está cerrado a la venta y ya no admite ediciones.
          enum:
            - SCHEDULED
            - CANCELLED
          type: string
        llegada:
          type: string
        origen:
          example: BOG
          type: string
        precioBaseUsd:
          description: Tarifa base por adulto en USD, antes de familia e impuestos.
          type: number
        salida:
          type: string
        vueloId:
          format: uuid
          type: string
      required:
        - vueloId
        - codigoVuelo
        - aerolinea
        - origen
        - destino
        - salida
        - llegada
        - duracionMinutos
        - precioBaseUsd
        - asientosDisponibles
        - capacidadTotal
        - asientosReservados
        - estado
      type: object
    AdminVuelosPaginaDto:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AdminVueloViewDto'
          type: array
        nextCursor:
          type: string
      required:
        - items
      type: object
    ArmarOfertaDto:
      properties:
        mercado:
          description: Mercado fijado al iniciar la transacción (RN-01).
          example: ec
          type: string
        pasajeros:
          $ref: '#/components/schemas/ComposicionDto'
        selecciones:
          description: Ida, y vuelta si es ida y vuelta, en ese orden.
          items:
            $ref: '#/components/schemas/SeleccionTrayectoDto'
          maxItems: 2
          minItems: 1
          type: array
      required:
        - mercado
        - selecciones
        - pasajeros
      type: object
    AsientoElegidoDto:
      properties:
        asiento:
          example: 12A
          type: string
        trayectoId:
          description: itinerarioId del trayecto de la oferta donde se elige el asiento.
          format: uuid
          type: string
      required:
        - trayectoId
        - asiento
      type: object
    AsientoOrdenViewDto:
      properties:
        asiento:
          example: 12A
          type: string
        numeroVuelo:
          example: LA800
          type: string
      required:
        - numeroVuelo
        - asiento
      type: object
    AsientoViewDto:
      properties:
        characteristics:
          example:
            - WINDOW
          items:
            type: string
          type: array
        isAvailable:
          type: boolean
        seatNumber:
          example: 12A
          type: string
      required:
        - seatNumber
        - isAvailable
        - characteristics
      type: object
    BaggageAddedResponseDto:
      properties:
        itineraryId:
          format: uuid
          type: string
        passengerId:
          type: string
        totalBaggage:
          description: Extra bags the passenger now has on this leg.
          type: number
      required:
        - passengerId
        - itineraryId
        - totalBaggage
      type: object
    BaggageAllowanceDto:
      properties:
        carryOnIncluded:
          type: number
        checkedBaggageIncluded:
          type: number
        personalItemIncluded:
          type: boolean
      required:
        - personalItemIncluded
        - carryOnIncluded
        - checkedBaggageIncluded
      type: object
    BaggageOptionDto:
      properties:
        alreadyPurchased:
          type: number
        itineraryId:
          format: uuid
          type: string
        maxAllowed:
          description: Most extra bags the passenger can have on this leg; equals alreadyPurchased when the sale is closed.
          type: number
        passengerId:
          type: string
        price:
          allOf:
            - $ref: '#/components/schemas/MoneyAmountDto'
          description: Price of one extra bag on this leg.
      required:
        - passengerId
        - itineraryId
        - price
        - maxAllowed
        - alreadyPurchased
      type: object
    BoardingPassDto:
      properties:
        barcode:
          description: Signed text (bp1.<e-ticket>.<PNR>.<flight>.<seat>.<signature>); carries no personal data.
          type: string
        barcodeType:
          enum:
            - AZTEC
            - PDF417
            - QR
          type: string
        boardingGroup:
          example: A
          nullable: true
          type: string
        boardingPosition:
          example: '7'
          nullable: true
          type: string
        passengerId:
          type: string
        seat:
          example: 12A
          type: string
        segmentId:
          format: uuid
          type: string
      required:
        - passengerId
        - segmentId
        - seat
        - barcode
        - barcodeType
      type: object
    BoardingPassListResponseDto:
      properties:
        boardingPasses:
          items:
            $ref: '#/components/schemas/BoardingPassDto'
          type: array
        bookingId:
          format: uuid
          type: string
      required:
        - bookingId
        - boardingPasses
      type: object
    BookingDetailResponseDto:
      properties:
        bookingId:
          format: uuid
          type: string
        changes:
          description: History of changes (date changes, flight reschedules, cancellation).
          items:
            type: string
          type: array
        createdAt:
          type: string
        grandTotal:
          $ref: '#/components/schemas/MoneyAmountDto'
        pnr:
          type: string
        status:
          enum:
            - PENDING
            - PENDING_PAYMENT
            - TICKET_ISSUING
            - CONFIRMED
            - FAILED
            - CHANGE_PENDING
            - CANCELLATION_PENDING
            - CANCELLED
          type: string
        tickets:
          items:
            $ref: '#/components/schemas/TicketResponseDto'
          type: array
        updatedAt:
          type: string
      required:
        - bookingId
        - pnr
        - status
        - grandTotal
        - createdAt
        - updatedAt
      type: object
    BookingListItemDto:
      properties:
        bookingId:
          format: uuid
          type: string
        departureDate:
          format: date
          type: string
        destination:
          example: SCL
          type: string
        grandTotal:
          $ref: '#/components/schemas/MoneyAmountDto'
        origin:
          example: BOG
          type: string
        pnr:
          type: string
        status:
          enum:
            - PENDING
            - PENDING_PAYMENT
            - TICKET_ISSUING
            - CONFIRMED
            - FAILED
            - CHANGE_PENDING
            - CANCELLATION_PENDING
            - CANCELLED
          type: string
      required:
        - bookingId
        - pnr
        - status
        - origin
        - destination
        - departureDate
        - grandTotal
      type: object
    BookingListResponseDto:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BookingListItemDto'
          type: array
        nextCursor:
          description: Present when another page exists.
          type: string
      required:
        - items
      type: object
    BookingRequestDto:
      properties:
        holdId:
          format: uuid
          type: string
        passengers:
          items:
            $ref: '#/components/schemas/PassengerItemDto'
          type: array
        payment:
          $ref: '#/components/schemas/PaymentReferenceDto'
      required:
        - holdId
        - passengers
        - payment
      type: object
    CabinPricingDto:
      properties:
        availableSeats:
          type: number
        baggageAllowance:
          $ref: '#/components/schemas/BaggageAllowanceDto'
        cabinClass:
          enum:
            - ECONOMY
            - PREMIUM_ECONOMY
            - BUSINESS
            - FIRST
          type: string
        fareBrand:
          example: BASIC
          type: string
        fareRules:
          $ref: '#/components/schemas/FareRulesDto'
        pricePerPassengerType:
          description: Unit price for every passenger type present in the request.
          items:
            $ref: '#/components/schemas/PricePerPassengerTypeDto'
          type: array
      required:
        - cabinClass
        - fareBrand
        - availableSeats
        - fareRules
        - baggageAllowance
        - pricePerPassengerType
      type: object
    CancelBookingRequestDto:
      properties:
        quoteId:
          description: quoteId of a live cancellation quote of this booking.
          format: uuid
          type: string
        reason:
          type: string
      required:
        - quoteId
      type: object
    CancelBookingResponseDto:
      properties:
        bookingId:
          format: uuid
          type: string
        currency:
          example: USD
          type: string
        penaltyAmount:
          example: '35.00'
          type: string
        refundAmount:
          example: '315.00'
          type: string
        status:
          example: CANCELLED
          type: string
      required:
        - bookingId
        - status
        - refundAmount
        - penaltyAmount
        - currency
      type: object
    CancellationQuoteResponseDto:
      properties:
        currency:
          example: USD
          type: string
        expiresAt:
          format: date-time
          type: string
        isRefundable:
          description: 'The fare rule: false for a non-refundable fare (only the taxes come back).'
          type: boolean
        penaltyAmount:
          example: '35.00'
          type: string
        quoteId:
          format: uuid
          type: string
        refundAmount:
          example: '315.00'
          type: string
      required:
        - quoteId
        - isRefundable
        - refundAmount
