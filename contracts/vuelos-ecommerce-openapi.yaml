# GENERADO por scripts/export-openapi.js desde el /api/docs-json de la API en ejecución. No editar a mano:
# cambia el código y vuelve a ejecutar `npm run contract:export`. Describe TODO el sistema actual de Vuelos:
# núcleo GDS (contracts/vuelos-openapi.yaml), e-commerce y administración.
openapi: 3.0.0
info:
  description: >-
    Contrato del sistema de Vuelos tal como está implementado: núcleo GDS (búsqueda, retención de cupos, reservas, billetes, posventa,
    check-in, webhooks), e-commerce (identidad, catálogo, ofertas, pagos simulados, órdenes) y administración (órdenes, vuelos, usuarios,
    dashboard, observabilidad).


    Convenciones comunes: prefijo /api/v1; autenticación Bearer JWT (HS256) y `ownerId` siempre igual al `sub` verificado; errores
    `application/problem+json` con el campo `code`; las escrituras críticas exigen `Idempotency-Key` (UUID); los importes en el borde de la
    API son cadenas decimales y en el sistema son enteros en unidades menores.
  title: RAM Alliance · API de Vuelos (sistema completo)
  version: '1.0'
servers:
  - description: Producción (Railway)
    url: https://proyect-flights-rda1-plantilla-production.up.railway.app/api/v1
  - description: Desarrollo local
    url: http://localhost:3000/api/v1
tags: []
paths:
  /admin/auditoria:
    get:
      operationId: AdminMercadosController_auditoria
      parameters:
        - in: query
          name: entidad
          required: false
          schema:
            default: mercado
            example: mercado
            type: string
        - description: Si se omite, todos.
          in: query
          name: id
          required: false
          schema:
            example: ec
            type: string
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Petición inválida
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No autenticado
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Prohibido
      security:
        - bearer: []
      summary: Historial de cambios de configuración (ADMIN)
      tags:
        - E-commerce · Back-office
  /admin/dashboard:
    get:
      description: >-
        Indicadores (ingresos, órdenes, ticket promedio, conversión, cancelación, reembolsos, ocupación futura), una serie diaria para
        graficar, el embudo oferta→pago→emisión, el reparto por estado, las rutas con más reservas, la ocupación por ruta y la actividad de
        posventa y webhooks. Todo son agregados calculados desde la base de datos (sin datos personales); se guarda en caché unos segundos.
      operationId: DashboardController_resumen
      parameters:
        - description: Días hacia atrás, contando hoy (UTC).
          in: query
          name: dias
          required: false
          schema:
            default: 30
            enum:
              - 7
              - 30
              - 90
            type: number
      responses:
        '200':
          description: Cifras agregadas para el panel.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Petición inválida
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No autenticado
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Prohibido
      security:
        - bearer: []
      summary: 'Dashboard de gestión: ventas, conversión, rutas y ocupación (ADMIN)'
      tags:
        - E-commerce · Observabilidad
  /admin/mercados/{codigo}:
    put:
      description: 'RF-ADM-001: control optimista por versión y registro en auditoría (RF-ADM-006).'
      operationId: AdminMercadosController_actualizar
      parameters:
        - description: Código de mercado (ruta del portal)
          in: path
          name: codigo
          required: true
          schema:
            example: ec
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarMercadoDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MercadoViewDto'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Petición inválida
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No autenticado
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Prohibido
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No encontrado
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Conflicto
      security:
        - bearer: []
      summary: Editar la configuración de un mercado (ADMIN)
      tags:
        - E-commerce · Back-office
  /admin/notificaciones:
    get:
      description: Sin filtros devuelve los 50 más recientes; filtre por referencia o destinatario. El cuerpo se descifra solo para este rol.
      operationId: AdminNotificacionesController_listar
      parameters:
        - description: Número de orden o id de cliente al que se refiere el mensaje.
          in: query
          name: referencia
          required: false
          schema:
            type: string
        - in: query
          name: destinatario
          required: false
          schema:
            type: string
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Petición inválida
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No autenticado
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Prohibido
      security:
        - bearer: []
      summary: Mensajes enviados (ADMIN)
      tags:
        - E-commerce · Back-office
  /admin/observabilidad/resumen:
    get:
      description: >-
        Órdenes por estado, ingresos por moneda, pagos y tasas (rechazo, antifraude, compensación), pendientes de reconciliación,
        notificaciones, reservas temporales, ocupación del inventario y últimos cambios auditados. Se calcula sobre la ventana pedida (24h o
        7d) y se guarda en caché unos segundos; sobrevive a los reinicios porque sale de la base.
      operationId: ObservabilidadController_resumen
      parameters:
        - description: Ventana de tiempo de las cifras.
          in: query
          name: ventana
          required: false
          schema:
            default: 24h
            enum:
              - 24h
              - 7d
            type: string
      responses:
        '200':
          description: Cifras agregadas, sin datos personales.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Petición inválida
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No autenticado
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Prohibido
      security:
        - bearer: []
      summary: Resumen operativo calculado desde la base de datos (ADMIN)
      tags:
        - E-commerce · Observabilidad
  /admin/observabilidad/runtime:
    get:
      description: >-
        Peticiones, errores y latencia por ruta, códigos de error, eventos de dominio, límites de tasa y la última ejecución del
        reconciliador y del barredor de reservas. Son contadores en memoria de ESTE proceso: parten de cero en cada reinicio.
      operationId: ObservabilidadController_runtime
      parameters: []
      responses:
        '200':
          description: Contadores desde el arranque del proceso.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No autenticado
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Prohibido
      security:
        - bearer: []
      summary: Métricas en vivo del proceso (ADMIN)
      tags:
        - E-commerce · Observabilidad
  /admin/ordenes:
    get:
      description: Más recientes primero, paginado por cursor; filtros por estado, número, PNR y fechas.
      operationId: AdminController_ordenes
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            default: 25
            maximum: 100
            minimum: 1
            type: number
        - description: Cursor opaco de la página anterior (nextCursor).
          in: query
          name: cursor
          required: false
          schema:
            type: string
        - in: query
          name: estado
          required: false
          schema:
            enum:
              - PENDIENTE_PAGO
              - PAGO_EN_VERIFICACION
              - PAGADA
              - EMITIDA
              - FALLIDA_COMPENSADA
              - MODIFICADA
              - DEVOLUCION_EN_CURSO
              - REEMBOLSADA
              - EN_VIAJE
              - COMPLETADA
              - EXPIRADA
            type: string
        - in: query
          name: numero
          required: false
          schema:
            example: ORD-7K3M9PQ2XA
            type: string
        - in: query
          name: pnr
          required: false
          schema:
            example: ABC123
            type: string
        - description: Creadas desde este día (UTC).
          in: query
          name: desde
          required: false
          schema:
            format: date
            type: string
        - description: Creadas hasta este día (UTC, inclusive).
          in: query
          name: hasta
          required: false
          schema:
            format: date
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrdenesPaginaDto'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Petición inválida
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No autenticado
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Prohibido
      security:
        - bearer: []
      summary: Listar órdenes de todos los clientes (ADMIN)
      tags:
        - E-commerce · Back-office
  /admin/ordenes/{numero}:
    get:
      description: Incluye el contacto del comprador.
      operationId: AdminController_orden
      parameters:
        - description: Número de orden
          in: path
          name: numero
          required: true
          schema:
            example: ORD-7K3M9PQ2XA
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrdenViewDto'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Petición inválida
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No autenticado
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Prohibido
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No encontrado
      security:
        - bearer: []
      summary: Detalle completo de una orden (ADMIN)
      tags:
        - E-commerce · Back-office
  /admin/usuarios:
    get:
      description: Más recientes primero, con búsqueda por correo o nombre y filtro por rol. Nunca incluye contraseñas ni tokens.
      operationId: UsuariosController_listar
      parameters:
        - description: Texto a buscar en el correo, los nombres o los apellidos.
          in: query
          name: q
          required: false
          schema:
            type: string
        - description: Solo los usuarios que tienen este rol.
          in: query
          name: rol
          required: false
          schema:
            enum:
              - CUSTOMER
              - ADMIN
            type: string
        - in: query
          name: pagina
          required: false
          schema:
            default: 1
            minimum: 1
            type: number
        - in: query
          name: limite
          required: false
          schema:
            default: 25
            maximum: 100
            minimum: 1
            type: number
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsuariosPaginaDto'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Petición inválida
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No autenticado
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Prohibido
      security:
        - bearer: []
      summary: Listar usuarios (ADMIN)
      tags:
        - E-commerce · Back-office
    post:
      description: >-
        Crea la cuenta con el correo ya verificado. Con roles ["CUSTOMER","ADMIN"] se crea un administrador. Queda registrado en la
        auditoría.
      operationId: UsuariosController_crear
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCrearUsuarioDto'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsuarioViewDto'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Petición inválida
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No autenticado
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Prohibido
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Conflicto
      security:
        - bearer: []
      summary: Crear un usuario (ADMIN)
      tags:
        - E-commerce · Back-office
  /admin/usuarios/{clienteId}:
    get:
      operationId: UsuariosController_obtener
      parameters:
        - in: path
          name: clienteId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsuarioViewDto'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Petición inválida
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No autenticado
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Prohibido
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No encontrado
      security:
        - bearer: []
      summary: Detalle de un usuario (ADMIN)
      tags:
        - E-commerce · Back-office
  /admin/usuarios/{clienteId}/roles:
    put:
      description: >-
        Ascender a administrador (roles ["CUSTOMER","ADMIN"]) o quitarle el rol (["CUSTOMER"]). No se puede quitar el rol a uno mismo ni al
        último administrador (409 LAST_ADMIN). El rol viaja en el token: el cambio se aplica al siguiente inicio de sesión del usuario.
      operationId: UsuariosController_cambiarRoles
      parameters:
        - in: path
          name: clienteId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCambiarRolesDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsuarioViewDto'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Petición inválida
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No autenticado
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Prohibido
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No encontrado
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Conflicto
      security:
        - bearer: []
      summary: Cambiar los roles de un usuario (ADMIN)
      tags:
        - E-commerce · Back-office
  /admin/vuelos:
    get:
      description: Por salida ascendente, desde hoy si no se indica fecha; filtros por ruta, día y número de vuelo.
      operationId: AdminController_vuelos
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            default: 25
            maximum: 100
            minimum: 1
            type: number
        - description: Cursor opaco de la página anterior (nextCursor).
          in: query
          name: cursor
          required: false
          schema:
            type: string
        - in: query
          name: origen
          required: false
          schema:
            example: BOG
            type: string
        - in: query
          name: destino
          required: false
          schema:
            example: SCL
            type: string
        - description: 'Día de salida (UTC). Sin fecha: desde hoy.'
          in: query
          name: fecha
          required: false
          schema:
            format: date
            type: string
        - in: query
          name: vuelo
          required: false
          schema:
            example: LA800
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVuelosPaginaDto'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Petición inválida
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No autenticado
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Prohibido
      security:
        - bearer: []
      summary: Listar vuelos con su inventario (ADMIN)
      tags:
        - E-commerce · Back-office
    post:
      description: >-
        Agrega un vuelo al calendario: todos sus asientos quedan disponibles y aparece en la búsqueda. El código lleva la aerolínea en sus
        dos primeros caracteres; origen y destino deben existir en el catálogo; la salida debe ser futura. 409 si ese código ya sale a esa
        hora.
      operationId: AdminController_crearVuelo
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCrearVueloDto'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVueloViewDto'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Petición inválida
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No autenticado
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Prohibido
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Conflicto
      security:
        - bearer: []
      summary: Crear un vuelo (ADMIN)
      tags:
        - E-commerce · Back-office
  /admin/vuelos/{vueloId}:
    delete:
      description: >-
        Borra un vuelo que nunca tuvo retenciones, reservas ni asientos asignados. Si tiene historial responde 409 FLIGHT_IN_USE: cancélalo
        en su lugar (cierra la venta y reembolsa las reservas).
      operationId: AdminController_eliminarVuelo
      parameters:
        - in: path
          name: vueloId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: Eliminado
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Petición inválida
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No autenticado
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Prohibido
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No encontrado
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Conflicto
      security:
        - bearer: []
      summary: Eliminar un vuelo (ADMIN)
      tags:
        - E-commerce · Back-office
    patch:
      description: >-
        Cambia aerolínea, tarifa base, duración (recalcula la llegada) o capacidad. Solo vuelos programados que no han salido. La capacidad
        no puede bajar de los asientos ya vendidos ni dejar asientos numerados fuera de la cabina. Para mover la salida usa reprogramar.
      operationId: AdminController_actualizarVuelo
      parameters:
        - in: path
          name: vueloId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActualizarVueloDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVueloViewDto'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Petición inválida
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No autenticado
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Prohibido
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: No encontrado
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
          description: Conflicto
      security:
        - bearer: []
      summary: Editar un vuelo (ADMIN)
      tags:
        - E-commerce · Back-office
  /admin/vuelos/{vueloId}/asientos:
    get:
      description: >-
        Mapa de la cabina con la disponibilidad de cada asiento y la lista de reservados con su código de reserva y orden. No muestra
        nombres de pasajeros.
      operationId: AdminController_asientos
      parameters:
