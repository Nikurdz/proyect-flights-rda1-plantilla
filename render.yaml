services:
  - type: web
    name: vuelos-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: booking-db
          property: connectionString
      - key: TAX_RATE
        value: '0.15'
      - key: DEFAULT_CURRENCY
        value: USD
      - key: OFFER_TTL_MINUTES
        value: '15'
      - key: HOLD_TTL_MINUTES
        value: '15'

databases:
  - name: booking-db
    plan: free
