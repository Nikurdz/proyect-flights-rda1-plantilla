server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Assets con hash de Vite: cache larga e inmutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html nunca en cache: referencia los assets de la ultima compilacion.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA: cualquier ruta del cliente cae en index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
